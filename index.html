<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LIVE TV</title>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.3/dist/shaka-player.compiled.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#020305;color:#fff;font-family:Arial,sans-serif}
body{overflow:hidden}

/* HOME */
#home{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  background:radial-gradient(circle at center,#10242b 0,#05080b 42%,#010203 100%);
}
#home:before,#home:after{
  content:"";position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none
}
#home:before{width:330px;height:330px;border:1px solid rgba(25,216,255,.15);box-shadow:0 0 80px rgba(25,216,255,.12)}
#home:after{width:520px;height:520px;border:1px solid rgba(25,216,255,.06)}

.brand{position:relative;text-align:center;z-index:2;width:100%;max-width:520px;padding:20px}

.logo{
  width:430px;min-height:210px;margin:auto;border-radius:28px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,rgba(16,27,32,.98),rgba(2,5,7,.98));
  border:2px solid #19d8ff;
  box-shadow:0 0 20px rgba(25,216,255,.55),0 0 70px rgba(25,216,255,.15),inset 0 0 30px rgba(25,216,255,.08);
  transition:.2s;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.logo:active{transform:scale(.96)}

.match{width:100%;display:flex;align-items:center;justify-content:center;gap:20px}
.team{width:145px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.team-logo{
  width:95px;height:95px;border-radius:50%;object-fit:cover;background:#fff;
  border:3px solid rgba(255,255,255,.85);box-shadow:0 0 18px rgba(25,216,255,.45)
}
.team-name{margin-top:12px;font-size:15px;font-weight:900;letter-spacing:1px;color:#fff;text-transform:uppercase}
.vs{
  width:55px;height:55px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#19d8ff,#087e99);color:#001015;font-size:18px;font-weight:1000;
  box-shadow:0 0 20px rgba(25,216,255,.65);flex-shrink:0
}
.title{margin-top:22px;font-size:24px;font-weight:900;letter-spacing:4px}
.subtitle{margin-top:8px;font-size:11px;letter-spacing:2px;color:#8fa2a8}
.tap{
  margin-top:25px;display:inline-block;padding:9px 18px;border:1px solid rgba(25,216,255,.45);
  border-radius:30px;color:#19d8ff;font-size:12px;letter-spacing:1px
}

/* PLAYER */
#playerPage{display:none;position:fixed;inset:0;background:#000;z-index:100}
video{width:100%;height:100%;object-fit:contain;background:#000}

#back{
  position:absolute;top:16px;left:16px;z-index:110;width:46px;height:46px;
  border:1px solid rgba(255,255,255,.25);border-radius:50%;
  background:rgba(0,0,0,.65);color:#fff;font-size:28px;cursor:pointer
}

#message{
  position:absolute;left:50%;bottom:25px;transform:translateX(-50%);z-index:120;
  padding:10px 16px;border-radius:10px;background:rgba(0,0,0,.78);
  color:#ddd;font-size:13px;display:none;max-width:90%;text-align:center
}
#message.error{color:#ffb3b3;border:1px solid rgba(255,80,80,.35)}
#reload{
  display:none;position:absolute;left:50%;bottom:80px;transform:translateX(-50%);
  z-index:121;border:1px solid #19d8ff;background:rgba(0,0,0,.8);color:#19d8ff;
  border-radius:24px;padding:10px 18px;font-weight:700
}

@media(max-width:600px){
  .brand{padding:15px}
  .logo{width:94%;min-height:190px;border-radius:24px}
  .match{gap:8px}
  .team{width:105px}
  .team-logo{width:75px;height:75px}
  .team-name{font-size:12px;margin-top:9px}
  .vs{width:48px;height:48px;font-size:15px}
  .title{font-size:20px;letter-spacing:3px}
  .subtitle{font-size:9px}
}
</style>
</head>

<body>

<div id="home">
  <div class="brand">
    <div class="logo" id="logoButton">
      <div class="match">
        <div class="team">
          <img class="team-logo" src="https://flagcdn.com/w320/bd.png" alt="Bangladesh">
          <div class="team-name">Bangladesh</div>
        </div>

        <div class="vs">VS</div>

        <div class="team">
          <img class="team-logo" src="https://flagcdn.com/w320/ar.png" alt="Argentina">
          <div class="team-name">Argentina</div>
        </div>
      </div>
    </div>

    <div class="title">LIVE TV</div>
    <div class="subtitle">PREMIUM STREAM PLAYER</div>
    <div class="tap">TAP MATCH TO PLAY</div>
  </div>
</div>

<div id="playerPage">
  <button id="back" type="button" onclick="closePlayer()">‹</button>
  <video id="video" controls playsinline></video>
  <div id="message"></div>
  <button id="reload" type="button" onclick="openPlayer()">RETRY</button>
</div>

<script>
/*
  IMPORTANT:
  Put ONLY a stream you are authorized to play here.

  Format:
  MPD_URL|drmScheme=clearkey&drmLicense=KEY_ID:KEY

  Do not publish private DRM credentials in a public repository if they
  are not intended to be public.
*/
const STREAM_URL =
`https://otte.live.fly.ww.aiv-cdn.net/iad-nitro/live/clients/dash/enc/docqurfrc3/out/v1/1804c33d898a48cb988e15cca0199512/cenc.mpd|drmScheme=clearkey&drmLicense=2fbb11f58d670ba448625bee36773fff:76e8bd546a74e60598e1d59df0b9b3cc`;

let player = null;
let loading = false;

function showMessage(text, error=false){
  const el = document.getElementById("message");
  el.textContent = text;
  el.className = error ? "error" : "";
  el.style.display = "block";
}

function hideMessage(){
  document.getElementById("message").style.display = "none";
}

function showRetry(show){
  document.getElementById("reload").style.display = show ? "block" : "none";
}

/*
  Supports:
  MPD|drmScheme=clearkey&drmLicense=KEY_ID:KEY
*/
function parseStream(input){
  const sep = input.indexOf("|");

  if(sep === -1){
    return {
      mpd: input.trim(),
      drmScheme: "",
      drmLicense: ""
    };
  }

  const mpd = input.slice(0, sep).trim();
  const query = input.slice(sep + 1);

  const params = new URLSearchParams(query);

  return {
    mpd,
    drmScheme: (params.get("drmScheme") || "").trim().toLowerCase(),
    drmLicense: (params.get("drmLicense") || "").trim()
  };
}

function parseClearKey(value){
  const pos = value.indexOf(":");

  if(pos <= 0 || pos === value.length - 1){
    throw new Error("Invalid ClearKey format. Expected KEY_ID:KEY");
  }

  const keyId = value.slice(0,pos).trim().toLowerCase();
  const key = value.slice(pos + 1).trim().toLowerCase();

  if(!keyId || !key){
    throw new Error("ClearKey ID or key is empty.");
  }

  return {keyId, key};
}

function friendlyError(err){
  const code = err && err.code ? `Shaka error ${err.code}` : "Unknown playback error";

  if(err && err.data){
    try{
      return `${code}: ${err.data.join(" | ")}`;
    }catch(e){}
  }

  return code;
}

async function openPlayer(){
  if(loading) return;

  if(!STREAM_URL ||
     STREAM_URL.includes("PASTE_YOUR_AUTHORIZED_MPD_LINK_HERE")){
    document.getElementById("home").style.display = "none";
    document.getElementById("playerPage").style.display = "block";
    showRetry(false);
    showMessage("Add your authorized MPD stream in STREAM_URL first.", true);
    return;
  }

  loading = true;
  showRetry(false);

  document.getElementById("home").style.display = "none";
  document.getElementById("playerPage").style.display = "block";
  showMessage("Loading stream...");

  try{
    shaka.polyfill.installAll();

    if(!shaka.Player.isBrowserSupported()){
      throw new Error("This browser does not support Shaka/DASH playback.");
    }

    const data = parseStream(STREAM_URL);

    if(!data.mpd || !/^https?:\/\//i.test(data.mpd)){
      throw new Error("Invalid MPD URL.");
    }

    const video = document.getElementById("video");

    if(player){
      try{ await player.destroy(); }catch(e){}
      player = null;
    }

    player = new shaka.Player(video);

    player.addEventListener("error", onShakaError);

    /*
      ClearKey:
      Shaka accepts a map of key ID -> key.
      This is for authorized ClearKey streams only.
    */
    if(data.drmScheme === "clearkey"){
      if(!data.drmLicense){
        throw new Error("ClearKey DRM is selected but no license value was provided.");
      }

      const ck = parseClearKey(data.drmLicense);

      player.configure({
        drm:{
          clearKeys:{
            [ck.keyId]: ck.key
          }
        }
      });
    }

    await player.load(data.mpd);

    hideMessage();
    showRetry(false);

    try{
      await video.play();
    }catch(e){
      /*
        Mobile browsers may block autoplay.
        The controls remain available, so the user can press Play.
      */
      console.log("Autoplay blocked:", e);
    }

  }catch(err){
    console.error("Playback error:", err);

    showMessage(
      "Playback failed. " + (err.message || friendlyError(err)),
      true
    );

    showRetry(true);
  }finally{
    loading = false;
  }
}

function onShakaError(event){
  const detail = event.detail || event;

  console.error("Shaka error:", detail);

  showMessage(
    "Playback error: " + friendlyError(detail),
    true
  );

  showRetry(true);
}

async function closePlayer(){
  loading = false;
  showRetry(false);

  if(player){
    try{ await player.destroy(); }catch(e){}
    player = null;
  }

  const video = document.getElementById("video");

  video.pause();
  video.removeAttribute("src");
  video.load();

  hideMessage();

  document.getElementById("playerPage").style.display = "none";
  document.getElementById("home").style.display = "flex";
}

document.getElementById("logoButton").addEventListener("click", openPlayer);
</script>

</body>
</html>
