<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>LIVE TV</title>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.3/dist/shaka-player.compiled.js"></script>

<style>

/* =====================================================
   BASIC
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;
    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    touch-action:manipulation;
}


/* =====================================================
   HOME
===================================================== */

.home{
    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
    radial-gradient(
        circle at center,
        #092027 0%,
        #03090c 45%,
        #000 80%
    );
}

.logo-area{
    width:390px;
    max-width:90vw;

    text-align:center;

    cursor:pointer;
    user-select:none;

    animation:fadeIn .8s ease;
}

.logo{
    width:280px;
    height:280px;

    max-width:70vw;
    max-height:70vw;

    margin:auto;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #101c20 0%,
        #071115 55%,
        #020608 100%
    );

    border:3px solid #18d5ff;

    box-shadow:
        0 0 20px #00cfff,
        0 0 60px rgba(0,205,255,.45),
        inset 0 0 30px rgba(0,205,255,.18);

    transition:.25s;
}

.logo:before{
    content:"";

    position:absolute;

    inset:-12px;

    border:8px solid transparent;

    border-top-color:#ff743e;
    border-right-color:#ff743e;
    border-bottom-color:#ff743e;

    border-radius:47% 53% 45% 55%;

    transform:rotate(-22deg);

    filter:
        drop-shadow(
            0 0 7px #ff6332
        );
}

.logo:after{
    content:"";

    position:absolute;

    width:155px;
    height:100px;

    top:30px;
    right:-18px;

    border-top:7px solid #ff743e;

    border-radius:50%;

    transform:rotate(-10deg);

    filter:
        drop-shadow(
            0 0 6px #ff6332
        );
}

.tv{
    position:relative;

    z-index:2;

    font-size:75px;

    filter:
        drop-shadow(
            0 0 8px #55dfff
        );
}

.logo-title{
    margin-top:30px;

    font-size:36px;
    font-weight:800;

    letter-spacing:6px;
}

.logo-subtitle{
    margin-top:15px;

    color:#8c9a9f;

    font-size:17px;

    letter-spacing:5px;
}

.tap{
    width:285px;
    max-width:80vw;

    height:60px;

    margin:42px auto 0;

    display:flex;

    align-items:center;
    justify-content:center;

    border:1px solid #12bde8;

    border-radius:35px;

    color:#16caff;

    font-size:16px;

    letter-spacing:2px;

    box-shadow:
        0 0 12px
        rgba(0,190,240,.18);

    transition:.25s;
}

.logo-area:active .logo{
    transform:scale(.96);
}

.logo-area:hover .tap{
    background:
        rgba(0,190,240,.12);

    box-shadow:
        0 0 25px
        rgba(0,190,240,.35);
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:scale(.9);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}


/* =====================================================
   PLAYER
===================================================== */

.player{

    position:fixed;

    inset:0;

    width:100vw;
    height:100dvh;

    z-index:9999;

    display:none;

    background:#000;

    overflow:hidden;

    transform:none;

    transform-origin:center center;

    transition:
        transform .3s ease,
        width .3s ease,
        height .3s ease;
}

.player.open{
    display:block;
}


/* =====================================================
   ROTATED FALLBACK MODE
===================================================== */

/*
   Used when native fullscreen/orientation
   is unavailable.
*/

.player.rotated{

    position:fixed;

    width:100dvh;
    height:100dvw;

    top:50%;
    left:50%;

    right:auto;
    bottom:auto;

    inset:auto;

    transform:
        translate(-50%,-50%)
        rotate(90deg);

    transform-origin:center center;

    overflow:hidden;
}


/* =====================================================
   VIDEO
===================================================== */

video{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{

    position:absolute;

    inset:0;

    z-index:10;

    display:flex;

    flex-direction:column;

    justify-content:space-between;

    background:
    linear-gradient(
        to bottom,
        rgba(0,0,0,.75),
        transparent 25%,
        transparent 58%,
        rgba(0,0,0,.95)
    );

    opacity:1;

    transition:
        opacity .3s ease;
}

.controls.hide{

    opacity:0;

    pointer-events:none;
}


/* =====================================================
   TOP BAR
===================================================== */

.top{

    width:100%;

    min-height:70px;

    display:flex;

    align-items:center;

    padding:
        12px
        max(16px, env(safe-area-inset-left))
        12px
        max(16px, env(safe-area-inset-right));

    gap:10px;
}

.title{

    flex:1;

    text-align:center;

    font-size:18px;

    font-weight:bold;

    letter-spacing:3px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.top-btn{

    width:46px;
    height:46px;

    flex-shrink:0;

    border:0;

    border-radius:50%;

    background:
        rgba(0,0,0,.65);

    color:#fff;

    font-size:25px;

    cursor:pointer;
}

.top-btn:active{

    background:
        rgba(255,255,255,.15);
}


/* =====================================================
   CENTER
===================================================== */

.center{

    flex:1;

    display:flex;

    align-items:center;
    justify-content:center;
}

.center-play{

    width:76px;
    height:76px;

    border:2px solid #fff;

    border-radius:50%;

    background:
        rgba(0,0,0,.55);

    color:#fff;

    font-size:28px;

    cursor:pointer;
}


/* =====================================================
   BOTTOM
===================================================== */

.bottom{

    position:relative;

    width:100%;

    padding:
        10px
        max(15px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(15px, env(safe-area-inset-left));
}

.progress-row{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:10px;

    font-size:14px;
}

.progress{

    flex:1;

    min-width:0;

    height:5px;

    appearance:none;

    background:#555;

    border-radius:10px;

    outline:none;
}

.progress::-webkit-slider-thumb{

    appearance:none;

    width:20px;
    height:20px;

    border-radius:50%;

    background:#fff;
}

.progress::-moz-range-thumb{

    width:20px;
    height:20px;

    border-radius:50%;

    border:0;

    background:#fff;
}


/* =====================================================
   BUTTONS
===================================================== */

.buttons{

    display:flex;

    align-items:center;

    gap:4px;

    width:100%;
}

.control{

    min-width:43px;
    height:43px;

    flex-shrink:0;

    border:0;

    border-radius:8px;

    background:transparent;

    color:#fff;

    font-size:19px;

    cursor:pointer;
}

.control:active{

    background:
        rgba(255,255,255,.15);
}

.volume{

    width:105px;

    flex-shrink:1;

    min-width:50px;
}


/* =====================================================
   QUALITY
===================================================== */

.quality-btn{

    position:relative;
}

.quality-menu{

    position:absolute;

    right:12px;
    bottom:75px;

    min-width:180px;

    max-height:300px;

    overflow-y:auto;

    display:none;

    padding:8px;

    border-radius:12px;

    background:
        rgba(15,15,15,.98);

    border:
        1px solid
        rgba(255,255,255,.18);

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.6);

    z-index:50;
}

.quality-menu.show{
    display:block;
}

.quality-title{

    padding:9px 12px;

    color:#aaa;

    font-size:12px;

    text-transform:uppercase;

    letter-spacing:1px;
}

.quality-item{

    width:100%;

    padding:12px;

    border:0;

    border-radius:8px;

    background:transparent;

    color:#fff;

    text-align:left;

    font-size:14px;

    cursor:pointer;
}

.quality-item:active{

    background:
        rgba(255,255,255,.1);
}

.quality-item.active{

    background:#08bde9;

    color:#000;

    font-weight:bold;
}


/* =====================================================
   LOADING
===================================================== */

.loading{

    position:absolute;

    inset:0;

    z-index:20;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:
        rgba(0,0,0,.72);
}

.loading.show{
    display:flex;
}

.spinner{

    width:48px;
    height:48px;

    border:4px solid #333;

    border-top-color:#12d5ff;

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

.loading-text{

    margin-top:15px;

    color:#ddd;

    font-size:14px;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =====================================================
   ERROR
===================================================== */

.error-box{

    position:absolute;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.72);
}

.error-box.show{
    display:flex;
}

.error-card{

    width:100%;

    max-width:440px;

    max-height:90vh;

    overflow:auto;

    padding:28px 22px;

    border-radius:20px;

    text-align:center;

    background:#111;

    border:
        1px solid #333;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.7);
}

.error-icon{

    font-size:45px;

    margin-bottom:12px;
}

.error-title{

    font-size:22px;

    font-weight:bold;

    margin-bottom:12px;
}

.error-message{

    color:#aaa;

    font-size:14px;

    line-height:1.6;

    word-break:break-word;
}

.error-code{

    margin-top:12px;

    padding:10px;

    border-radius:8px;

    background:#080808;

    color:#12c7f4;

    font-size:12px;

    word-break:break-all;
}

.error-close{

    margin-top:22px;

    padding:12px 28px;

    border:0;

    border-radius:30px;

    background:#12c7f4;

    color:#001018;

    font-size:15px;

    font-weight:bold;
}


/* =====================================================
   NATIVE FULLSCREEN
===================================================== */

.player:fullscreen{

    width:100vw;
    height:100vh;

    background:#000;
}

.player:-webkit-full-screen{

    width:100vw;
    height:100vh;

    background:#000;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .logo{
        width:250px;
        height:250px;
    }

    .tv{
        font-size:65px;
    }

    .logo-title{
        font-size:31px;
        letter-spacing:5px;
    }

    .logo-subtitle{
        font-size:14px;
        letter-spacing:4px;
    }

    .tap{

        margin-top:35px;

        height:55px;

        font-size:14px;
    }

    .bottom{

        padding:
            7px
            8px
            max(12px, env(safe-area-inset-bottom))
            8px;
    }

    .buttons{
        gap:1px;
    }

    .control{

        min-width:37px;

        height:40px;

        font-size:16px;
    }

    .volume{
        width:72px;
    }

    .title{
        font-size:16px;
    }

    .quality-menu{

        right:7px;

        bottom:65px;

        min-width:165px;
    }

}


/* =====================================================
   LANDSCAPE
===================================================== */

@media(orientation:landscape){

    .top{
        min-height:58px;
        padding:7px 12px;
    }

    .top-btn{

        width:40px;
        height:40px;

        font-size:22px;
    }

    .bottom{

        padding:
            5px
            12px
            10px;
    }

    .control{

        min-width:40px;
        height:40px;
    }

    .center-play{

        width:65px;
        height:65px;
    }
}


/* =====================================================
   VERY SMALL HEIGHT
===================================================== */

@media(max-height:430px){

    .top{

        min-height:48px;

        padding:
            4px 10px;
    }

    .top-btn{

        width:36px;
        height:36px;

        font-size:20px;
    }

    .bottom{

        padding:
            3px 8px 6px;
    }

    .progress-row{

        margin-bottom:5px;
    }

    .control{

        min-width:35px;
        height:35px;

        font-size:15px;
    }

    .volume{
        width:65px;
    }
}

</style>

</head>

<body>


<!-- =====================================================
     HOME
===================================================== -->

<div id="home" class="home">

    <div id="logoArea" class="logo-area">

        <div class="logo">

            <div class="tv">
                📺
            </div>

        </div>

        <div class="logo-title">
            LIVE TV
        </div>

        <div class="logo-subtitle">
            PREMIUM STREAM PLAYER
        </div>

        <div class="tap">
            TAP LOGO TO PLAY
        </div>

    </div>

</div>


<!-- =====================================================
     PLAYER
===================================================== -->

<div id="player" class="player">

    <video
        id="video"
        playsinline
        webkit-playsinline
        preload="auto">
    </video>


    <!-- LOADING -->

    <div id="loading" class="loading">

        <div class="spinner"></div>

        <div class="loading-text">
            Loading stream...
        </div>

    </div>


    <!-- ERROR -->

    <div id="errorBox" class="error-box">

        <div class="error-card">

            <div class="error-icon">
                ⚠️
            </div>

            <div class="error-title">
                Playback Error
            </div>

            <div
                id="errorMessage"
                class="error-message">
                MPD stream could not be loaded.
            </div>

            <div
                id="errorCode"
                class="error-code">
            </div>

            <button
                id="errorClose"
                class="error-close">
                CLOSE
            </button>

        </div>

    </div>


    <!-- CONTROLS -->

    <div id="controls" class="controls">


        <!-- TOP -->

        <div class="top">

            <button
                id="backHome"
                class="top-btn">
                ←
            </button>

            <div
                id="playerTitle"
                class="title">
                LIVE TV
            </div>

            <button
                id="fullscreen"
                class="top-btn">
                
            </button>

        </div>


        <!-- CENTER -->

        <div class="center">

            <button
                id="centerPlay"
                class="center-play">
                ▶
            </button>

        </div>


        <!-- BOTTOM -->

        <div class="bottom">

            <div class="progress-row">

                <span id="current">
                    00:00
                </span>

                <input
                    id="progress"
                    class="progress"
                    type="range"
                    min="0"
                    max="1000"
                    value="0">

                <span id="duration">
                    LIVE
                </span>

            </div>


            <div class="buttons">

                <button
                    id="play"
                    class="control">
                    ▶
                </button>

                <button
                    id="mute"
                    class="control">
                    🔊
                </button>

                <input
                    id="volume"
                    class="volume"
                    type="range"
                    min="0"
                    max="1"
                    step=".01"
                    value="1">

                <button
                    id="back10"
                    class="control">
                    ↶10
                </button>

                <button
                    id="forward10"
                    class="control">
                    10↷
                </button>

                <button
                    id="pip"
                    class="control">
                    ▣
                </button>

                <button
                    id="qualityButton"
                    class="control quality-btn">
                    ⚙️
                </button>

                <button
                    id="fullscreen2"
                    class="control">
                    ⛶
                </button>

            </div>


            <!-- QUALITY MENU -->

            <div
                id="qualityMenu"
                class="quality-menu">

                <div class="quality-title">
                    Video Quality
                </div>

                <button
                    class="quality-item active"
                    data-quality="auto">
                    Auto
                </button>

                <div id="qualityList"></div>

            </div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   STREAM SETTINGS
===================================================== */

/*
   Use only an MPD stream you are authorized to play.
*/

const MPD_URL =
"https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/rhf2dwosdt/out/v1/ee550d2a68d846c797e6ce4de2e8b76d/cenc.mpd";


/*
   ClearKey configuration.
*/

const KID =
"69a5aa835a061ce64a630d1046727e40";

const KEY =
"d02feac8a999bd06bf4059bf33411749";


const CHANNEL_NAME =
"LIVE TV";


/* =====================================================
   ELEMENTS
===================================================== */

const home =
document.getElementById("home");

const logoArea =
document.getElementById("logoArea");

const playerBox =
document.getElementById("player");

const video =
document.getElementById("video");

const controls =
document.getElementById("controls");

const loading =
document.getElementById("loading");

const playerTitle =
document.getElementById("playerTitle");

const play =
document.getElementById("play");

const centerPlay =
document.getElementById("centerPlay");

const mute =
document.getElementById("mute");

const volume =
document.getElementById("volume");

const progress =
document.getElementById("progress");

const current =
document.getElementById("current");

const duration =
document.getElementById("duration");

const qualityButton =
document.getElementById("qualityButton");

const qualityMenu =
document.getElementById("qualityMenu");

const qualityList =
document.getElementById("qualityList");

const errorBox =
document.getElementById("errorBox");

const errorMessage =
document.getElementById("errorMessage");

const errorCode =
document.getElementById("errorCode");


/* =====================================================
   VARIABLES
===================================================== */

let shakaPlayer = null;

let hideTimer = null;

let isRotated = false;

let historyStateAdded = false;

let nativeFullscreen = false;


/* =====================================================
   SHOW ERROR
===================================================== */

function showError(message, code){

    loading.classList.remove("show");

    errorMessage.textContent =
        message || "Unknown playback error.";

    if(code){

        errorCode.textContent =
            "Shaka Error Code: " + code;

        errorCode.style.display =
            "block";

    }else{

        errorCode.textContent =
            "";

        errorCode.style.display =
            "none";
    }

    errorBox.classList.add("show");

}


/* =====================================================
   CLOSE ERROR
===================================================== */

document
.getElementById("errorClose")
.onclick =
function(){

    errorBox.classList.remove("show");

};


/* =====================================================
   SHAKA INIT
===================================================== */

async function initPlayer(){

    shaka.polyfill.installAll();


    if(
        !shaka.Player.isBrowserSupported()
    ){

        showError(
            "This browser does not support DASH/MPD playback."
        );

        return false;
    }


    shakaPlayer =
        new shaka.Player(video);


    /*
       Shaka error event
    */

    shakaPlayer.addEventListener(
        "error",
        function(event){

            console.error(
                "SHAKA ERROR:",
                event.detail
            );

            const err =
                event.detail;

            showError(
                getShakaErrorText(err),
                err && err.code
            );

        }
    );


    /*
       Optional buffering event
    */

    shakaPlayer.addEventListener(
        "buffering",
        function(event){

            if(event.buffering){

                loading.classList.add(
                    "show"
                );

            }else{

                loading.classList.remove(
                    "show"
                );

            }

        }
    );


    return true;
}


/* =====================================================
   SHAKA ERROR TEXT
===================================================== */

function getShakaErrorText(error){

    if(!error){

        return "Unknown Shaka playback error.";
    }


    switch(error.code){

        case 1001:
            return "Browser does not support the required media format.";

        case 1002:
            return "Media source could not be loaded.";

        case 1003:
            return "Media decoding failed.";

        case 2001:
            return "MPD manifest could not be downloaded.";

        case 2002:
            return "MPD manifest could not be parsed.";

        case 4001:
            return "DRM initialization failed.";

        case 6001:
            return "DRM system is not supported by this browser.";

        case 6002:
            return "DRM license request failed.";

        case 6003:
            return "DRM license response was invalid.";

        case 6007:
            return "The supplied DRM key could not decrypt the stream.";

        default:
            return (
                "MPD playback failed. " +
                "Check MPD URL, DRM configuration, CORS and stream availability."
            );
    }

}


/* =====================================================
   OPEN PLAYER
===================================================== */

logoArea.onclick =
async function(){

    home.style.display =
        "none";

    playerBox.classList.add(
        "open"
    );

    playerTitle.textContent =
        CHANNEL_NAME;

    errorBox.classList.remove(
        "show"
    );

    loading.classList.add(
        "show"
    );


    if(!shakaPlayer){

        const ok =
            await initPlayer();

        if(!ok){

            return;
        }
    }


    /*
       ClearKey
    */

    if(KID && KEY){

        shakaPlayer.configure({

            drm:{
                clearKeys:{
                    [KID.toLowerCase()]:
                        KEY.toLowerCase()
                }
            }

        });

    }


    try{

        await shakaPlayer.load(
            MPD_URL
        );


        loading.classList.remove(
            "show"
        );


        buildQualityMenu();


        try{

            await video.play();

        }catch(e){

            console.log(
                "Autoplay blocked:",
                e
            );

        }


        updatePlayButton();

        showControls();

    }
    catch(error){

        console.error(
            "MPD LOAD ERROR:",
            error
        );

        loading.classList.remove(
            "show"
        );


        showError(
            getShakaErrorText(error),
            error && error.code
        );

    }

};


/* =====================================================
   QUALITY MENU
===================================================== */

function buildQualityMenu(){

    qualityList.innerHTML =
        "";

    if(!shakaPlayer){

        return;
    }


    const tracks =
        shakaPlayer.getVariantTracks();


    const qualities = {};


    tracks.forEach(
        function(track){

            if(
                track.height &&
                !qualities[track.height]
            ){

                qualities[track.height] =
                    track;
            }

        }
    );


    const heights =
        Object.keys(qualities)
        .map(Number)
        .sort(
            (a,b)=>b-a
        );


    if(!heights.length){

        const item =
            document.createElement(
                "div"
            );

        item.style.padding =
            "12px";

        item.style.color =
            "#aaa";

        item.textContent =
            "Quality information unavailable";

        qualityList.appendChild(
            item
        );

        return;
    }


    heights.forEach(
        function(height){

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "quality-item";

            button.textContent =
                height + "p";


            button.onclick =
            function(e){

                e.stopPropagation();

                selectQuality(
                    height
                );

            };


            qualityList.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   SELECT QUALITY
===================================================== */

function selectQuality(height){

    if(!shakaPlayer){

        return;
    }


    const tracks =
        shakaPlayer.getVariantTracks();


    const matching =
        tracks.filter(
            function(track){

                return (
                    track.height === height
                );

            }
        );


    if(!matching.length){

        return;
    }


    matching.sort(
        function(a,b){

            return (
                b.bandwidth -
                a.bandwidth
            );

        }
    );


    shakaPlayer.selectVariantTrack(
        matching[0],
        true
    );


    shakaPlayer.configure({

        abr:{
            enabled:false
        }

    });


    document
    .querySelectorAll(
        ".quality-item"
    )
    .forEach(
        function(button){

            button.classList.remove(
                "active"
            );

            if(
                button.textContent ===
                height + "p"
            ){

                button.classList.add(
                    "active"
                );

            }

        }
    );


    qualityMenu.classList.remove(
        "show"
    );

    showControls();

}


/* =====================================================
   AUTO QUALITY
===================================================== */

function setAutoQuality(){

    if(!shakaPlayer){

        return;
    }


    shakaPlayer.configure({

        abr:{
            enabled:true
        }

    });


    document
    .querySelectorAll(
        ".quality-item"
    )
    .forEach(
        function(button){

            button.classList.remove(
                "active"
            );

        }
    );


    const auto =
        document.querySelector(
            '[data-quality="auto"]'
        );


    if(auto){

        auto.classList.add(
            "active"
        );

    }


    qualityMenu.classList.remove(
        "show"
    );

    showControls();

}


document
.querySelector(
    '[data-quality="auto"]'
)
.onclick =
function(e){

    e.stopPropagation();

};

/* =====================================================
   VOLUME
===================================================== */

/* =====================================================
   PROGRESS
===================================================== */

video.addEventListener(
    "timeupdate",
    function(){

        if(
            Number.isFinite(
                video.duration
            )
        ){

            current.textContent =
                formatTime(
                    video.currentTime
                );

            duration.textContent =
                formatTime(
                    video.duration
                );


            if(video.duration > 0){

                progress.value =
                    (
                        video.currentTime /
                        video.duration
                    ) * 1000;

            }

        }else{

            current.textContent =
                "LIVE";

            duration.textContent =
                "LIVE";

        }

    }
);


progress.oninput =
function(){

    if(
        Number.isFinite(
            video.duration
        )
    ){

        video.currentTime =
            (
                Number(
                    progress.value
                ) / 1000
            ) *
            video.duration;

    }

};


/* =====================================================
   TIME
===================================================== */

function formatTime(seconds){

    if(
        !Number.isFinite(seconds)
    ){

        return "00:00";
    }


    seconds =
        Math.floor(seconds);


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    const secs =
        seconds % 60;


    if(hours > 0){

        return (
            String(hours).padStart(2,"0")
            +
            ":" +
            String(minutes).padStart(2,"0")
            +
            ":" +
            String(secs).padStart(2,"0")
        );

    }


    return (
        String(minutes).padStart(2,"0")
        +
        ":" +
        String(secs).padStart(2,"0")
    );

}

/* =====================================================
   ENTER 90° MODE
===================================================== */

async function enterRotatedMode(){

    if(isRotated){

        return;
    }


    isRotated = true;


    /*
       Add exactly ONE history state.
       Android Back will consume this state.
    */

    if(!historyStateAdded){

        history.pushState(
            {
                liveTvLandscape:true
            },
            "",
            "#landscape"
        );

        historyStateAdded = true;
    }


    /*
       First apply CSS fallback.
       This guarantees 90° mode even
       when native orientation APIs fail.
    */

    playerBox.classList.add(
        "rotated"
    );


    /*
       Try native orientation lock.
    */

    try{

        if(
            screen.orientation &&
            typeof screen.orientation.lock ===
            "function"
        ){

            await screen.orientation
                .lock("landscape")
                .catch(
                    function(){

                        console.log(
                            "Landscape lock unavailable"
                        );

                    }
                );

        }

    }catch(error){

        console.log(
            "Orientation API unavailable:",
            error
        );

    }


    showControls();

}


/* =====================================================
   EXIT 90° MODE
===================================================== */

async function exitRotatedMode(
    fromBack = false
){

    if(!isRotated){

        return;
    }


    isRotated = false;


    /*
       Remove CSS rotation.
    */

    playerBox.classList.remove(
        "rotated"
    );


    /*
       Unlock orientation.
    */

    try{

        if(
            screen.orientation &&
            typeof screen.orientation.unlock ===
            "function"
        ){

            screen.orientation.unlock();

        }

    }catch(error){

        console.log(error);

    }


    /*
       If exiting through Android Back,
       the browser has already consumed
       our history state.

       If exiting through button,
       remove the extra state.
    */

    if(
        !fromBack &&
        historyStateAdded
    ){

        historyStateAdded = false;

        if(
            location.hash ===
            "#landscape"
        ){

            history.replaceState(
                null,
                "",
                location.pathname +
                location.search
            );

        }

    }


    showControls();

}


/* =====================================================
   TRUE FULLSCREEN
===================================================== */

async function enterNativeFullscreen(){

    nativeFullscreen = false;


    try{

        if(
            document.fullscreenElement
        ){

            nativeFullscreen = true;

            return true;
        }


        if(
            playerBox.requestFullscreen
        ){

            await playerBox.requestFullscreen();

            nativeFullscreen = true;

            return true;
        }


        /*
           Safari / WebKit fallback.
        */

        if(
            playerBox.webkitRequestFullscreen
        ){

            playerBox.webkitRequestFullscreen();

            nativeFullscreen = true;

            return true;
        }

    }catch(error){

        console.log(
            "Native fullscreen unavailable:",
            error
        );

    }


    return false;
}


/* =====================================================
   EXIT NATIVE FULLSCREEN
===================================================== */

async function exitNativeFullscreen(){

    try{

        if(
            document.fullscreenElement
        ){

            await document.exitFullscreen();

        }
        else if(
            document.webkitFullscreenElement
        ){

            document.webkitExitFullscreen();

        }

    }catch(error){

        console.log(error);

    }

    nativeFullscreen = false;
}


/* =====================================================
   FULLSCREEN BUTTON
===================================================== */

async function fullscreen(){

    /*
       If already in 90° mode:
       return to normal.
    */

    if(isRotated){

        await exitNativeFullscreen();

        await exitRotatedMode(false);

        return;
    }


    /*
       User clicked the button,
       so request native fullscreen
       while still inside the gesture.
    */

    await enterNativeFullscreen();


    /*
       CSS rotation is still applied.
       This is important for Android WebView
       where orientation lock may not work.
    */

    await enterRotatedMode();

}


document
.getElementById("fullscreen")
.onclick =
fullscreen;

document
.getElementById("fullscreen2")
.onclick =
fullscreen;


/* =====================================================
   FULLSCREEN CHANGE
===================================================== */

document.addEventListener(
    "fullscreenchange",
    function(){

        showControls();

    }
);


/* WebKit */

document.addEventListener(
    "webkitfullscreenchange",
    function(){

        showControls();

    }
);


/* =====================================================
   ANDROID BACK BUTTON / POPSTATE
===================================================== */

window.addEventListener(
    "popstate",
    async function(){

        /*
           First Back:
           landscape -> portrait
        */

        if(isRotated){

            historyStateAdded = false;

            await exitNativeFullscreen();

            await exitRotatedMode(true);

            return;
        }


        /*
           Second Back:
           player -> home
        */

        if(
            playerBox.classList.contains(
                "open"
            )
        ){

            closePlayer();

        }

    }
);


/* =====================================================
   CLOSE PLAYER
===================================================== */

async function closePlayer(){

    /*
       If rotated, return to normal.
    */

    if(isRotated){

        historyStateAdded = false;

        await exitNativeFullscreen();

        await exitRotatedMode(true);
    }


    qualityMenu.classList.remove(
        "show"
    );


    errorBox.classList.remove(
        "show"
    );


    video.pause();


    /*
       Unload stream to stop network.
    */

    if(shakaPlayer){

        try{

            await shakaPlayer.unload();

        }catch(error){

            console.log(error);

        }

    }


    playerBox.classList.remove(
        "open"
    );


    home.style.display =
        "flex";

}


/* =====================================================
   BACK HOME BUTTON
===================================================== */

document
.getElementById("backHome")
.onclick =
async function(){

    /*
       If rotated:
       first return to portrait.
    */

    if(isRotated){

        historyStateAdded = false;

        await exitNativeFullscreen();

        await exitRotatedMode(true);

    }


    await closePlayer();

};


/* =====================================================
   PICTURE IN PICTURE
===================================================== */

document
.getElementById("pip")
.onclick =
async function(){

    try{

        if(
            document.pictureInPictureElement
        ){

            await document
                .exitPictureInPicture();

        }
        else if(
            document.pictureInPictureEnabled
        ){

            await video
                .requestPictureInPicture();

        }

    }catch(error){

        console.log(
            "PiP unavailable:",
            error
        );

    }

};


/* =====================================================
   AUTO HIDE CONTROLS
===================================================== */

function showControls(){

    controls.classList.remove(
        "hide"
    );


    clearTimeout(
        hideTimer
    );


    hideTimer =
        setTimeout(
            function(){

                if(
                    !video.paused &&
                    !qualityMenu.classList.contains(
                        "show"
                    )
                ){

                    controls.classList.add(
                        "hide"
                    );

                }

            },
            4000
        );

}


/* =====================================================
   TOUCH
===================================================== */

playerBox.addEventListener(
    "touchstart",
    function(){

        showControls();

    },
    {
        passive:true
    }
);


playerBox.addEventListener(
    "mousemove",
    function(){

        showControls();

    }
);


/* =====================================================
   VIDEO CLICK
===================================================== */

video.addEventListener(
    "click",
    function(){

        showControls();

    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    async function(e){

        if(
            !playerBox.classList.contains(
                "open"
            )
        ){

            return;
        }


        /*
           Space
        */

        if(e.code === "Space"){

            e.preventDefault();

            togglePlay();

        }


        /*
           Escape
        */

        if(e.key === "Escape"){

            if(isRotated){

                await exitNativeFullscreen();

                await exitRotatedMode(false);

            }

        }


        /*
           Left
        */

        if(
            e.key === "ArrowLeft"
        ){

            if(
                Number.isFinite(
                    video.currentTime
                )
            ){

                video.currentTime =
                    Math.max(
                        0,
                        video.currentTime - 10
                    );

            }

        }


        /*
           Right
        */

        if(
            e.key === "ArrowRight"
        ){

            if(
                Number.isFinite(
                    video.duration
                )
            ){

                video.currentTime =
                    Math.min(
                        video.duration,
                        video.currentTime + 10
                    );

            }

        }

    }
);


/* =====================================================
   CLOSE QUALITY OUTSIDE
===================================================== */

document.addEventListener(
    "click",
    function(e){

        if(
            !qualityMenu.contains(e.target) &&
            e.target !== qualityButton
        ){

            qualityMenu.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   INITIAL STATE
===================================================== */

window.addEventListener(
    "load",
    function(){

        home.style.display =
            "flex";

        playerBox.classList.remove(
            "rotated"
        );

        isRotated = false;

        historyStateAdded = false;

    }
);
