<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>LIVE TV</title>

<!--
    Updated Shaka Player
    4.16.3 -> 4.16.50
-->
<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.50/dist/shaka-player.compiled.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;
    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    touch-action:manipulation;
}


/* =====================================================
   HOME
===================================================== */

.home{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    radial-gradient(
        circle at center,
        #092027 0%,
        #03090c 45%,
        #000 80%
    );
}

.logo-area{
    width:390px;
    max-width:90vw;

    text-align:center;

    cursor:pointer;
    user-select:none;

    animation:fadeIn .8s ease;
}

.logo{
    width:280px;
    height:280px;

    max-width:70vw;
    max-height:70vw;

    margin:auto;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #101c20 0%,
        #071115 55%,
        #020608 100%
    );

    border:3px solid #18d5ff;

    box-shadow:
        0 0 20px #00cfff,
        0 0 60px rgba(0,205,255,.45),
        inset 0 0 30px rgba(0,205,255,.18);

    transition:.25s;
}

.logo:before{
    content:"";

    position:absolute;
    inset:-12px;

    border:8px solid transparent;

    border-top-color:#ff743e;
    border-right-color:#ff743e;
    border-bottom-color:#ff743e;

    border-radius:47% 53% 45% 55%;

    transform:rotate(-22deg);

    filter:
        drop-shadow(0 0 7px #ff6332);
}

.logo:after{
    content:"";

    position:absolute;

    width:155px;
    height:100px;

    top:30px;
    right:-18px;

    border-top:7px solid #ff743e;

    border-radius:50%;

    transform:rotate(-10deg);

    filter:
        drop-shadow(0 0 6px #ff6332);
}

.tv{
    position:relative;
    z-index:2;

    font-size:75px;

    filter:
        drop-shadow(0 0 8px #55dfff);
}

.logo-title{
    margin-top:30px;

    font-size:36px;
    font-weight:800;

    letter-spacing:6px;
}

.logo-subtitle{
    margin-top:15px;

    color:#8c9a9f;

    font-size:17px;

    letter-spacing:5px;
}

.tap{
    width:285px;
    max-width:80vw;

    height:60px;

    margin:42px auto 0;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid #12bde8;
    border-radius:35px;

    color:#16caff;

    font-size:16px;
    letter-spacing:2px;

    box-shadow:
        0 0 12px rgba(0,190,240,.18);

    transition:.25s;
}

.logo-area:active .logo{
    transform:scale(.96);
}

.logo-area:hover .tap{
    background:
        rgba(0,190,240,.12);

    box-shadow:
        0 0 25px rgba(0,190,240,.35);
}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:scale(.9);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}


/* =====================================================
   PLAYER
===================================================== */

.player{
    position:fixed;

    inset:0;

    width:100vw;
    height:100dvh;

    z-index:9999;

    display:none;

    background:#000;

    overflow:hidden;
}

.player.open{
    display:block;
}


/* =====================================================
   ROTATED MODE
===================================================== */

.player.rotated{

    position:fixed;

    width:100dvh;
    height:100dvw;

    top:50%;
    left:50%;

    right:auto;
    bottom:auto;

    inset:auto;

    transform:
        translate(-50%,-50%)
        rotate(90deg);

    transform-origin:center center;

    overflow:hidden;
}


/* =====================================================
   VIDEO
===================================================== */

video{

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;
}


/* =====================================================
   CONTROLS
===================================================== */

.controls{

    position:absolute;

    inset:0;

    z-index:10;

    display:flex;

    flex-direction:column;

    justify-content:space-between;

    background:
    linear-gradient(
        to bottom,
        rgba(0,0,0,.78),
        transparent 25%,
        transparent 58%,
        rgba(0,0,0,.95)
    );

    opacity:1;

    transition:opacity .3s ease;
}

.controls.hide{

    opacity:0;

    pointer-events:none;
}


/* =====================================================
   TOP
===================================================== */

.top{

    width:100%;

    min-height:70px;

    display:flex;
    align-items:center;

    padding:
        12px
        max(16px,env(safe-area-inset-left))
        12px
        max(16px,env(safe-area-inset-right));

    gap:10px;
}

.title{

    flex:1;

    text-align:center;

    font-size:18px;
    font-weight:bold;

    letter-spacing:3px;

    white-space:nowrap;

    overflow:hidden;
    text-overflow:ellipsis;
}

.top-btn{

    width:46px;
    height:46px;

    flex-shrink:0;

    border:0;
    border-radius:50%;

    background:
        rgba(0,0,0,.65);

    color:#fff;

    font-size:25px;
}

.top-btn:active{
    background:
        rgba(255,255,255,.15);
}


/* =====================================================
   CENTER
===================================================== */

.center{

    flex:1;

    display:flex;
    align-items:center;
    justify-content:center;
}

.center-play{

    width:76px;
    height:76px;

    border:2px solid #fff;
    border-radius:50%;

    background:
        rgba(0,0,0,.55);

    color:#fff;

    font-size:28px;
}


/* =====================================================
   BOTTOM
===================================================== */

.bottom{

    position:relative;

    width:100%;

    padding:
        10px
        max(15px,env(safe-area-inset-right))
        max(18px,env(safe-area-inset-bottom))
        max(15px,env(safe-area-inset-left));
}

.progress-row{

    display:flex;
    align-items:center;

    gap:10px;

    margin-bottom:10px;

    font-size:14px;
}

.progress{

    flex:1;

    min-width:0;

    height:5px;

    appearance:none;

    background:#555;

    border-radius:10px;

    outline:none;
}

.progress::-webkit-slider-thumb{

    appearance:none;

    width:20px;
    height:20px;

    border-radius:50%;

    background:#fff;
}

.progress::-moz-range-thumb{

    width:20px;
    height:20px;

    border-radius:50%;

    border:0;

    background:#fff;
}


/* =====================================================
   BUTTONS
===================================================== */

.buttons{

    display:flex;
    align-items:center;

    gap:4px;

    width:100%;
}

.control{

    min-width:43px;
    height:43px;

    flex-shrink:0;

    border:0;
    border-radius:8px;

    background:transparent;

    color:#fff;

    font-size:19px;
}

.control:active{

    background:
        rgba(255,255,255,.15);
}

.volume{

    width:105px;

    flex-shrink:1;

    min-width:50px;
}


/* =====================================================
   QUALITY
===================================================== */

.quality-menu{

    position:absolute;

    right:12px;
    bottom:75px;

    min-width:180px;

    max-height:300px;

    overflow-y:auto;

    display:none;

    padding:8px;

    border-radius:12px;

    background:
        rgba(15,15,15,.98);

    border:
        1px solid
        rgba(255,255,255,.18);

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.6);

    z-index:50;
}

.quality-menu.show{
    display:block;
}

.quality-title{

    padding:9px 12px;

    color:#aaa;

    font-size:12px;

    text-transform:uppercase;

    letter-spacing:1px;
}

.quality-item{

    width:100%;

    padding:12px;

    border:0;

    border-radius:8px;

    background:transparent;

    color:#fff;

    text-align:left;

    font-size:14px;
}

.quality-item:active{
    background:
        rgba(255,255,255,.1);
}

.quality-item.active{

    background:#08bde9;

    color:#000;

    font-weight:bold;
}


/* =====================================================
   LOADING
===================================================== */

.loading{

    position:absolute;

    inset:0;

    z-index:20;

    display:none;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    background:
        rgba(0,0,0,.72);
}

.loading.show{
    display:flex;
}

.spinner{

    width:48px;
    height:48px;

    border:4px solid #333;

    border-top-color:#12d5ff;

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

.loading-text{

    margin-top:15px;

    color:#ddd;

    font-size:14px;

    text-align:center;

    padding:0 20px;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =====================================================
   ERROR
===================================================== */

.error-box{

    position:absolute;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.82);
}

.error-box.show{
    display:flex;
}

.error-card{

    width:100%;

    max-width:460px;

    max-height:90vh;

    overflow:auto;

    padding:28px 22px;

    border-radius:20px;

    text-align:center;

    background:#111;

    border:
        1px solid #333;

    box-shadow:
        0 15px 50px rgba(0,0,0,.7);
}

.error-icon{

    font-size:45px;

    margin-bottom:12px;
}

.error-title{

    font-size:22px;

    font-weight:bold;

    margin-bottom:12px;
}

.error-message{

    color:#aaa;

    font-size:14px;

    line-height:1.6;

    word-break:break-word;
}

.error-code{

    margin-top:12px;

    padding:10px;

    border-radius:8px;

    background:#080808;

    color:#12c7f4;

    font-size:12px;

    word-break:break-all;
}

.error-details{

    margin-top:10px;

    color:#777;

    font-size:11px;

    line-height:1.5;

    word-break:break-all;
}

.error-buttons{

    display:flex;

    justify-content:center;

    gap:10px;

    margin-top:22px;
}

.error-close,
.error-retry{

    padding:12px 24px;

    border:0;

    border-radius:30px;

    font-size:15px;

    font-weight:bold;
}

.error-close{

    background:#333;

    color:#fff;
}

.error-retry{

    background:#12c7f4;

    color:#001018;
}


/* =====================================================
   FULLSCREEN
===================================================== */

.player:fullscreen{

    width:100vw;
    height:100vh;

    background:#000;
}

.player:-webkit-full-screen{

    width:100vw;
    height:100vh;

    background:#000;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .logo{

        width:250px;
        height:250px;
    }

    .tv{
        font-size:65px;
    }

    .logo-title{

        font-size:31px;
        letter-spacing:5px;
    }

    .logo-subtitle{

        font-size:14px;
        letter-spacing:4px;
    }

    .tap{

        margin-top:35px;

        height:55px;

        font-size:14px;
    }

    .bottom{

        padding:
            7px
            8px
            max(12px,env(safe-area-inset-bottom))
            8px;
    }

    .buttons{
        gap:1px;
    }

    .control{

        min-width:37px;

        height:40px;

        font-size:16px;
    }

    .volume{
        width:72px;
    }

    .title{
        font-size:16px;
    }

    .quality-menu{

        right:7px;

        bottom:65px;

        min-width:165px;
    }

}


/* =====================================================
   LANDSCAPE
===================================================== */

@media(orientation:landscape){

    .top{

        min-height:58px;

        padding:7px 12px;
    }

    .top-btn{

        width:40px;
        height:40px;

        font-size:22px;
    }

    .bottom{

        padding:
            5px
            12px
            10px;
    }

    .control{

        min-width:40px;
        height:40px;
    }

    .center-play{

        width:65px;
        height:65px;
    }
}


/* =====================================================
   SMALL HEIGHT
===================================================== */

@media(max-height:430px){

    .top{

        min-height:48px;

        padding:4px 10px;
    }

    .top-btn{

        width:36px;
        height:36px;

        font-size:20px;
    }

    .bottom{

        padding:
            3px 8px 6px;
    }

    .progress-row{

        margin-bottom:5px;
    }

    .control{

        min-width:35px;
        height:35px;

        font-size:15px;
    }

    .volume{
        width:65px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     HOME
===================================================== -->

<div id="home" class="home">

    <div id="logoArea" class="logo-area">

        <div class="logo">

            <div class="tv">
                📺
            </div>

        </div>

        <div class="logo-title">
            LIVE TV
        </div>

        <div class="logo-subtitle">

        </div>

        <div class="tap">

        </div>

    </div>

</div>


<!-- =====================================================
     PLAYER
===================================================== -->

<div id="player" class="player">

    <video
        id="video"
        playsinline
        webkit-playsinline

    </video>


    <!-- LOADING -->

    <div id="loading" class="loading">

        <div class="spinner"></div>

        <div id="loadingText" class="loading-text">

    <div id="errorBox" class="error-box">

            <div
                id="playerTitle"

            </div>

            <button
                id="fullscreen"
                class="top-btn">

            </button>

        </div>


        <!-- CENTER -->

        <div class="center">

            <button
                id="centerPlay"
                class="center-play">
                ▶
            </button>

        </div>


        <!-- BOTTOM -->

        <div class="bottom">

            <div class="progress-row">

                <span id="current">
                    LIVE
                </span>

                <input
                    id="progress"
                    class="progress"
                    type="range"
                    min="0"
                    max="1000"
                    value="0">

                <span id="duration">
                    LIVE
                </span>

            </div>


            <div class="buttons">

                <button
                    id="play"
                    class="control">
                    ▶
                </button>

                <button
                    id="mute"
                    class="control">
                    🔊
                </button>

                <input
                    id="volume"
                    class="volume"
                    type="range"
                    min="0"
                    max="1"
                    step=".01"
                    value="1">

                <button
                    id="back10"
                    class="control">
                    ↶10
                </button>

                <button
                    id="forward10"
                    class="control">
                    10↷
                </button>

                <button
                    id="pip"
                    class="control">
                    ▣
                </button>

                <button
                    id="qualityButton"
                    class="control">
                    ⚙️
                </button>

                <button
                    id="fullscreen2"
                    class="control">
                    ⛶
                </button>

            </div>


            <!-- QUALITY -->

            <div
                id="qualityMenu"
                class="quality-menu">

                <div class="quality-title">
                    Video Quality
                </div>

                <button
                    class="quality-item active"

                </button>

                <div id="qualityList"></div>

</div>


<script>

/* =====================================================
   STREAM CONFIG
===================================================== */

/*
   IMPORTANT:
   Use only a stream you are authorized to play.
*/

const MPD_URL =
"https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/rhf2dwosdt/out/v1/ee550d2a68d846c797e6ce4de2e8b76d/cenc.mpd";


/*
   ClearKey
*/

const KID =
"69a5aa835a061ce64a630d1046727e40";

const KEY =
"d02feac8a999bd06bf4059bf33411749";


const CHANNEL_NAME =
"LIVE TV";


/* =====================================================
   ELEMENTS
===================================================== */

const home =
document.getElementById("home");

const logoArea =
document.getElementById("logoArea");

const playerBox =
document.getElementById("player");

const video =
document.getElementById("video");

const controls =
document.getElementById("controls");

const loading =
document.getElementById("loading");

const loadingText =
document.getElementById("loadingText");

const playerTitle =
document.getElementById("playerTitle");

const play =
document.getElementById("play");

const centerPlay =
document.getElementById("centerPlay");

const mute =
document.getElementById("mute");

const volume =
document.getElementById("volume");

const progress =
document.getElementById("progress");

const current =
document.getElementById("current");

const duration =
document.getElementById("duration");

const qualityButton =
document.getElementById("qualityButton");

const qualityMenu =
document.getElementById("qualityMenu");

const qualityList =
document.getElementById("qualityList");

const errorBox =
document.getElementById("errorBox");

const errorMessage =
document.getElementById("errorMessage");

const errorCode =
document.getElementById("errorCode");

const errorDetails =
document.getElementById("errorDetails");


/* =====================================================
   VARIABLES
===================================================== */

let shakaPlayer = null;

let hideTimer = null;

let isRotated = false;

let historyStateAdded = false;

let nativeFullscreen = false;

let loadingStream = false;


/* =====================================================
   SHAKA SUPPORT CHECK
===================================================== */

function checkBrowserSupport(){

    /*
       Basic browser support.
    */

    if(
        !window.MediaSource
    ){

        return {
            ok:false,
            message:
            "MediaSource Extensions are not available in this browser."
        };

    }


    /*
       Encrypted Media Extension.
    */

    if(
        !navigator.requestMediaKeySystemAccess
    ){

        return {
            ok:false,
            message:
            "Encrypted Media Extensions (EME) are not available. DRM playback cannot start."
        };

    }


    if(
        !shaka.Player.isBrowserSupported()
    ){

        return {
            ok:false,
            message:
            "This browser does not support Shaka DASH playback."
        };

    }


    return {
        ok:true
    };

}


/* =====================================================
   LOADING MESSAGE
===================================================== */

function setLoading(text){

    loadingText.textContent =
        text || "Loading stream...";

    loading.classList.add(
        "show"
    );

}


/* =====================================================
   HIDE LOADING
===================================================== */

function hideLoading(){

    loading.classList.remove(
        "show"
    );

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    message,
    code,
    details
){

    hideLoading();

    errorMessage.textContent =
        message ||
        "Unknown playback error.";

    if(code){

        errorCode.textContent =
            "Shaka Error Code: " +
            code;

        errorCode.style.display =
            "block";

    }else{

        errorCode.textContent =
            "";

        errorCode.style.display =
            "none";
    }


    errorDetails.textContent =
        details || "";


    errorBox.classList.add(
        "show"
    );

}


/* =====================================================
   CLOSE ERROR
===================================================== */

document
.getElementById("errorClose")
.onclick =
function(){

    errorBox.classList.remove(
        "show"
    );

};


/* =====================================================
   ERROR RETRY
===================================================== */

document
.getElementById("errorRetry")
.onclick =
async function(){

    errorBox.classList.remove(
        "show"
    );

    await loadStream();

};


/* =====================================================
   ERROR TEXT
===================================================== */

function getShakaErrorText(error){

    if(!error){

        return "Unknown playback error.";
    }


    const code =
        Number(error.code);


    switch(code){

        case 1001:

            return (
                "The browser could not find a playable media format in the MPD. " +
                "This is commonly caused by an unsupported video/audio codec, " +
                "unsupported encrypted media configuration, or an incompatible stream variant."
            );


        case 1002:

            return (
                "The media source operation failed. " +
                "The browser could not create or use the required MediaSource buffer."
            );


        case 1003:

            return (
                "The browser failed to decode the media. " +
                "Try a browser-compatible H.264/AAC stream."
            );


        case 2001:

            return (
                "The MPD manifest could not be downloaded. " +
                "Check the MPD URL and CORS/server availability."
            );


        case 2002:

            return (
                "The MPD manifest was downloaded but could not be parsed."
            );


        case 4001:

            return (
                "DRM initialization failed. " +
                "Check the ClearKey configuration and browser DRM support."
            );


        case 6001:

            return (
                "The required DRM system is not supported by this browser."
            );


        case 6002:

            return (
                "The DRM license request failed."
            );


        case 6003:

            return (
                "The DRM license response was invalid."
            );


        case 6007:

            return (
                "The supplied ClearKey could not decrypt the stream. " +
                "Check the KID and KEY."
            );


        default:

            return (
                "MPD playback failed. " +
                "Check the MPD, codec, DRM, CORS and stream availability."
            );

    }

}


/* =====================================================
   SHAKA INIT
===================================================== */

async function initPlayer(){

    /*
       Install Shaka polyfills.
    */

    shaka.polyfill.installAll();


    const support =
        checkBrowserSupport();


    if(!support.ok){

        showError(
            support.message
        );

        return false;
    }


    /*
       Create player.
    */

    shakaPlayer =
        new shaka.Player(video);


    /*
       Error event.
    */

    shakaPlayer.addEventListener(
        "error",
        function(event){

            const err =
                event.detail;

            console.error(
                "SHAKA ERROR:",
                err
            );


            showError(
                getShakaErrorText(err),
                err && err.code,
                err && err.message
                    ?
                    err.message
                    :
                    ""
            );

        }
    );


    /*
       Buffering.
    */

    shakaPlayer.addEventListener(
        "buffering",
        function(event){

            if(event.buffering){

                setLoading(
                    "Buffering..."
                );

            }else{

                hideLoading();

            }

        }
    );


    /*
       Adaptation.
    */

    shakaPlayer.addEventListener(
        "adaptation",
        function(){

            buildQualityMenu();

        }
    );


    /*
       Configure network retries.
    */

    shakaPlayer.configure({

        manifest:{

            retryParameters:{

                maxAttempts:4,

                baseDelay:500,

                backoffFactor:1.5,

                fuzzFactor:.2,

                timeout:15000

            }

        },

        streaming:{

            retryParameters:{

                maxAttempts:4,

                baseDelay:500,

                backoffFactor:1.5,

                fuzzFactor:.2,

                timeout:15000

            },

            rebufferingGoal:2,

            bufferingGoal:10,

            bufferBehind:30

        },

        drm:{

            retryParameters:{

                maxAttempts:3,

                baseDelay:500,

                backoffFactor:1.5,

                fuzzFactor:.2,

                timeout:10000

            }

        }

    });


    return true;

}


/* =====================================================
   CLEARKEY CONFIG
===================================================== */

function configureClearKey(){

    if(
        !KID ||
        !KEY
    ){

        return;
    }


    /*
       Shaka expects:
       key ID -> content key
       both hexadecimal.
    */

    shakaPlayer.configure({

        drm:{

            clearKeys:{

                [KID
                    .replace(
                        /[^a-fA-F0-9]/g,
                        ""
                    )
                    .toLowerCase()
                ]:

                KEY
                    .replace(
                        /[^a-fA-F0-9]/g,
                        ""
                    )
                    .toLowerCase()

            }

        }

    });

}


/* =====================================================
   LOAD STREAM
===================================================== */

async function loadStream(){

    if(loadingStream){

        return;
    }


    loadingStream = true;


    errorBox.classList.remove(
        "show"
    );


    playerBox.classList.add(
        "open"
    );


    playerTitle.textContent =
        CHANNEL_NAME;


    home.style.display =
        "none";


    setLoading(
        "Checking browser compatibility..."
    );


    /*
       Create Shaka once.
    */

    if(!shakaPlayer){

        const ok =
            await initPlayer();

        if(!ok){

            loadingStream = false;

            return;
        }

    }


    try{

        /*
           Stop previous media.
        */

        try{

            await shakaPlayer.unload();

        }catch(e){

            console.log(
                "Unload:",
                e
            );

        }


        video.removeAttribute(
            "src"
        );

        video.load();


        /*
           Configure ClearKey BEFORE load.
        */

        configureClearKey();


        setLoading(
            "Loading MPD manifest..."
        );


        /*
           Load MPD.
        */

        await shakaPlayer.load(
            MPD_URL
        );


        /*
           Manifest successfully loaded.
        */

        console.log(
            "MPD loaded successfully"
        );


        const manifest =
            shakaPlayer.getManifest();


        /*
           Get variants.
        */

        const tracks =
            shakaPlayer.getVariantTracks();


        console.log(
            "Variant tracks:",
            tracks
        );


        if(
            !tracks ||
            tracks.length === 0
        ){

            throw new Error(
                "No playable video/audio variants were found in the MPD."
            );

        }


        /*
           Check active tracks.
        */

        const playable =
            tracks.filter(
                function(track){

                    return (
                        track.video ||
                        track.audio
                    );

                }
            );


        if(
            playable.length === 0
        ){

            throw new Error(
                "The MPD contains no playable media variants for this browser."
            );

        }


        /*
           Show useful diagnostics.
        */

        console.log(
            "Playable variants:",
            playable.map(
                function(track){

                    return {

                        id:track.id,

                        width:track.width,

                        height:track.height,

                        bandwidth:track.bandwidth,

                        videoCodec:track.videoCodec,

                        audioCodec:track.audioCodec

                    };

                }
            )
        );


        buildQualityMenu();


        hideLoading();


        /*
           Start playback.
        */

        try{

            await video.play();

        }catch(playError){

            console.log(
                "Autoplay blocked:",
                playError
            );

            /*
               Don't treat autoplay block as
               a stream error.
            */

        }


        updatePlayButton();

        showControls();

    }
    catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );


        let message;


        /*
           Shaka Error
        */

        if(
            error &&
            typeof error.code !==
            "undefined"
        ){

            message =
                getShakaErrorText(
                    error
                );

        }else{

            message =
                error &&
                error.message
                    ?
                    error.message
                    :
                    "Unable to load the MPD stream.";

        }


        showError(
            message,
            error && error.code,
            error && error.message
                ?
                error.message
                :
                ""
        );

    }
    finally{

        loadingStream = false;

    }

}

/* =====================================================
   QUALITY MENU
===================================================== */

function buildQualityMenu(){

    qualityList.innerHTML =
        "";


    if(!shakaPlayer){

        return;
    }


    let tracks;


    try{

        tracks =
            shakaPlayer.getVariantTracks();

    }catch(e){

        return;

    }


    const qualities = {};


    tracks.forEach(
        function(track){

            if(
                track.height &&
                !qualities[track.height]
            ){

                qualities[track.height] =
                    track;

            }

        }
    );


    const heights =
        Object.keys(qualities)
        .map(Number)
        .sort(
            function(a,b){

                return b-a;

            }
        );


    if(!heights.length){

        const item =
            document.createElement(
                "div"
            );

        item.style.padding =
            "12px";

        item.style.color =
            "#aaa";

        item.textContent =
            "Quality information unavailable";

        qualityList.appendChild(
            item
        );

        return;

    }


    heights.forEach(
        function(height){

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "quality-item";

            button.textContent =
                height + "p";


            button.onclick =
            function(e){

                e.stopPropagation();

                selectQuality(
                    height
                );

            };


            qualityList.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   SELECT QUALITY
===================================================== */

function selectQuality(height){

    if(!shakaPlayer){

        return;
    }


    const tracks =
        shakaPlayer.getVariantTracks();


    const matching =
        tracks.filter(
            function(track){

                return (
                    track.height === height
                );

            }
        );


    if(!matching.length){

        return;
    }


    matching.sort(
        function(a,b){

            return (
                b.bandwidth -
                a.bandwidth
            );

        }
    );


    try{

        shakaPlayer.selectVariantTrack(
            matching[0],
            true
        );


        shakaPlayer.configure({

            abr:{
                enabled:false
            }

        });

    }catch(error){

        console.error(
            error
        );

        return;

    }


    document
    .querySelectorAll(
        ".quality-item"
    )
    .forEach(
        function(button){

            button.classList.remove(
                "active"
            );

            if(
                button.textContent ===
                height + "p"
            ){

                button.classList.add(
                    "active"
                );

            }

        }
    );


    qualityMenu.classList.remove(
        "show"
    );


    showControls();

}


/* =====================================================
   AUTO QUALITY
===================================================== */

function setAutoQuality(){

    if(!shakaPlayer){

        return;
    }


    shakaPlayer.configure({

        abr:{
            enabled:true
        }

    });


    document
    .querySelectorAll(
        ".quality-item"
    )
    .forEach(
        function(button){

            button.classList.remove(
                "active"
            );

        }
    );


    const auto =
        document.querySelector(
            '[data-quality="auto"]'
        );


    if(auto){

        auto.classList.add(
            "active"
        );

    }


    qualityMenu.classList.remove(
        "show"
    );


    showControls();

}


document
.querySelector(
    '[data-quality="auto"]'
)
.onclick =
function(e){

    setAutoQuality();

};

/* =====================================================
   PLAY / PAUSE
===================================================== */

function togglePlay(){

    if(video.paused){

        video.play()
        .catch(
            function(error){

                console.log(
                    "Play:",
                    error
                );

            }
        );

    }else{

        video.pause();

    }

}


function updatePlayButton(){

    if(video.paused){

        play.textContent =
            "▶";

        centerPlay.textContent =
            "▶";

    }else{

        play.textContent =
            "❚❚";

        centerPlay.textContent =
            "❚❚";

    }

}


play.onclick =
togglePlay;

centerPlay.onclick =
togglePlay;

    "play",
    updatePlayButton

video.addEventListener(

    updatePlayButton

/* =====================================================
   VOLUME
===================================================== */

volume.oninput =
function(){

    video.volume =
        Number(
            volume.value
        );

    video.muted =
        video.volume === 0;

    updateVolumeIcon();

};


mute.onclick =
function(){

    video.muted =
        !video.muted;

    updateVolumeIcon();

};


function updateVolumeIcon(){

    mute.textContent =
        video.muted
        ?
        "🔇"
        :
        "🔊";

}


/* =====================================================
   LIVE PROGRESS
===================================================== */

video.addEventListener(
    "timeupdate",
    function(){

        if(
            Number.isFinite(
                video.duration
            ) &&
            video.duration > 0
        ){

            current.textContent =
                formatTime(
                    video.currentTime
                );

            duration.textContent =
                formatTime(
                    video.duration
                );


            progress.value =
                (
                    video.currentTime /
                    video.duration
                ) * 1000;

        }else{

            current.textContent =
                "LIVE";

            duration.textContent =
                "LIVE";

            progress.value =
                1000;

        }

    }
);


/* =====================================================
   SEEK
===================================================== */

progress.oninput =
function(){

    if(
        Number.isFinite(
            video.duration
        ) &&
        video.duration > 0
    ){

        video.currentTime =
            (
                Number(
                    progress.value
                ) / 1000
            ) *
            video.duration;

    }

};


/* =====================================================
   TIME
===================================================== */

function formatTime(seconds){

    if(
        !Number.isFinite(seconds)
    ){

        return "00:00";

    }


    seconds =
        Math.floor(seconds);


    const hours =
        Math.floor(
            seconds / 3600
        );


    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );


    const secs =
        seconds % 60;


    if(hours > 0){

        return (
            String(hours).padStart(2,"0")
            +
            ":" +
            String(minutes).padStart(2,"0")
            +
            ":" +
            String(secs).padStart(2,"0")
        );

    }


    return (
        String(minutes).padStart(2,"0")
        +
        ":" +
        String(secs).padStart(2,"0")
    );

}


/* =====================================================
   SEEK BUTTONS
===================================================== */

document
.getElementById("back10")
.onclick =
function(){

    if(
        Number.isFinite(
            video.currentTime
        )
    ){

        video.currentTime =
            Math.max(
                0,
                video.currentTime - 10
            );

    }

};


document
.getElementById("forward10")
.onclick =
function(){

    if(
        Number.isFinite(
            video.duration
        )
    ){

        video.currentTime =
            Math.min(
                video.duration,
                video.currentTime + 10
            );

    }

};


/* =====================================================
   ROTATED MODE
===================================================== */

async function enterRotatedMode(){

    if(isRotated){

        return;
    }


    isRotated = true;


    if(!historyStateAdded){

        history.pushState(
            {
                liveTvLandscape:true
            },
            "",
            "#landscape"
        );

        historyStateAdded = true;

    }


    playerBox.classList.add(
        "rotated"
    );


    try{

        if(
            screen.orientation &&
            typeof screen.orientation.lock ===
            "function"
        ){

            await screen.orientation
                .lock("landscape")
                .catch(
                    function(error){

                        console.log(
                            "Orientation lock unavailable:",
                            error
                        );

                    }
                );

        }

    }catch(error){

        console.log(
            error
        );

    }


    showControls();

}


/* =====================================================
   EXIT ROTATED
===================================================== */

async function exitRotatedMode(
    fromBack=false
){

    if(!isRotated){

        return;
    }


    isRotated = false;


    playerBox.classList.remove(
        "rotated"
    );


    try{

        if(
            screen.orientation &&
            typeof screen.orientation.unlock ===
            "function"
        ){

            screen.orientation.unlock();

        }

    }catch(error){

        console.log(
            error
        );

    }


    if(
        !fromBack &&
        historyStateAdded
    ){

        historyStateAdded = false;


        if(
            location.hash ===
            "#landscape"
        ){

            history.replaceState(
                null,
                "",
                location.pathname +
                location.search
            );

        }

    }


    showControls();

}


/* =====================================================
   NATIVE FULLSCREEN
===================================================== */

async function enterNativeFullscreen(){

    nativeFullscreen =
        false;


    try{

        if(
            document.fullscreenElement
        ){

            nativeFullscreen =
                true;

            return true;

        }


        if(
            playerBox.requestFullscreen
        ){

            await playerBox.requestFullscreen();

            nativeFullscreen =
                true;

            return true;

        }


        if(
            playerBox.webkitRequestFullscreen
        ){

            playerBox.webkitRequestFullscreen();

            nativeFullscreen =
                true;

            return true;

        }

    }catch(error){

        console.log(
            "Fullscreen:",
            error
        );

    }


    return false;

}


/* =====================================================
   EXIT FULLSCREEN
===================================================== */

async function exitNativeFullscreen(){

    try{

        if(
            document.fullscreenElement
        ){

            await document.exitFullscreen();

        }
        else if(
            document.webkitFullscreenElement
        ){

            document.webkitExitFullscreen();

        }

    }catch(error){

        console.log(
            error
        );

    }


    nativeFullscreen =
        false;

}


/* =====================================================
   FULLSCREEN
===================================================== */

async function fullscreen(){

    if(isRotated){

        await exitNativeFullscreen();

        await exitRotatedMode(
            false
        );

        return;

    }


    await enterNativeFullscreen();

    await enterRotatedMode();

}


document
.getElementById("fullscreen")
.onclick =
fullscreen;

document
.getElementById("fullscreen2")
.onclick =
fullscreen;


/* =====================================================
   FULLSCREEN EVENTS
===================================================== */

document.addEventListener(
    "fullscreenchange",
    function(){

        showControls();

    }
);

document.addEventListener(
    "webkitfullscreenchange",
    function(){

        showControls();

    }
);


/* =====================================================
   ANDROID BACK
===================================================== */

window.addEventListener(
    "popstate",
    async function(){

        if(isRotated){

            historyStateAdded =
                false;

            await exitNativeFullscreen();

            await exitRotatedMode(
                true
            );

            return;

        }


        if(
            playerBox.classList.contains(
                "open"
            )
        ){

            await closePlayer();

        }

    }
);


/* =====================================================
   CLOSE PLAYER
===================================================== */

async function closePlayer(){

    if(isRotated){

        historyStateAdded =
            false;

        await exitNativeFullscreen();

        await exitRotatedMode(
            true
        );

    }


    qualityMenu.classList.remove(
        "show"
    );


    errorBox.classList.remove(
        "show"
    );


    video.pause();


    if(shakaPlayer){

        try{

            await shakaPlayer.unload();

        }catch(error){

            console.log(
                "Unload:",
                error
            );

        }

    }


    video.removeAttribute(
        "src"
    );

    video.load();


    playerBox.classList.remove(
        "open"
    );


    home.style.display =
        "flex";

}

   BACK HOME
===================================================== */

document
.getElementById("backHome")
.onclick =
async function(){

    await closePlayer();

};


/* =====================================================
   PIP
===================================================== */

document
.getElementById("pip")
.onclick =
async function(){

    try{

        if(
            document.pictureInPictureElement
        ){

            await document
                .exitPictureInPicture();

        }
        else if(
            document.pictureInPictureEnabled
        ){

            await video
                .requestPictureInPicture();

        }

    }catch(error){

        console.log(
            "PiP unavailable:",
            error
        );

    }

};


/* =====================================================
   AUTO HIDE
===================================================== */

function showControls(){

    controls.classList.remove(
        "hide"
    );


    clearTimeout(
        hideTimer
    );


    hideTimer =
        setTimeout(
            function(){

                if(
                    !video.paused &&
                    !qualityMenu.classList.contains(
                        "show"
                    )
                ){

                    controls.classList.add(
                        "hide"
                    );

                }

            },
            4000
        );

}


/* =====================================================
   TOUCH
===================================================== */

playerBox.addEventListener(
    "touchstart",
    function(){

        showControls();

    },
    {
        passive:true
    }
);


playerBox.addEventListener(
    "mousemove",
    function(){

        showControls();

    }
);


/* =====================================================
   VIDEO CLICK
===================================================== */

video.addEventListener(
    "click",
    function(){

        showControls();

    }
);


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    async function(e){

        if(
            !playerBox.classList.contains(
                "open"
            )
        ){

            return;
        }


        if(e.code === "Space"){

            e.preventDefault();

            togglePlay();

        }


        if(e.key === "Escape"){

            if(isRotated){

                await exitNativeFullscreen();

                await exitRotatedMode(
                    false
                );

            }

        }


        if(
            e.key === "ArrowLeft"
        ){

            if(
                Number.isFinite(
                    video.currentTime
                )
            ){

                video.currentTime =
                    Math.max(
                        0,
                        video.currentTime - 10
                    );

            }

        }


        if(
            e.key === "ArrowRight"
        ){

            if(
                Number.isFinite(
                    video.duration
                )
            ){

                video.currentTime =
                    Math.min(
                        video.duration,
                        video.currentTime + 10
                    );

            }

        }

    }
);


/* =====================================================
   OUTSIDE QUALITY MENU
===================================================== */

document.addEventListener(
    "click",
    function(e){

        if(
            !qualityMenu.contains(
                e.target
            ) &&
            e.target !==
            qualityButton
        ){

            qualityMenu.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   MEDIA ERROR
===================================================== */

video.addEventListener(
    "error",
    function(){

        const mediaError =
            video.error;


        if(
            mediaError &&
            !errorBox.classList.contains(
                "show"
            )
        ){

            console.error(
                "HTML VIDEO ERROR:",
                mediaError
            );

        }

    }
);


/* =====================================================
   INITIAL
===================================================== */

window.addEventListener(
    "load",
    function(){

        home.style.display =
            "flex";

        playerBox.classList.remove(
            "open"
        );

        playerBox.classList.remove(
            "rotated"
        );

        isRotated =
            false;

        historyStateAdded =
            false;

    }
);
