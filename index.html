<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>LIVE TV</title>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.50/dist/shaka-player.compiled.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

body{
  position:fixed;
  inset:0;
}

#app{
  width:100%;
  height:100%;
  background:#000;
  position:relative;
}

/* ================= PLAYER ================= */

#playerPage{
  position:absolute;
  inset:0;
  background:#000;
  display:none;
  z-index:10;
}

#video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
  object-fit:contain;
}

/* ================= TOP BAR ================= */

.topbar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:
    8px
    max(15px,env(safe-area-inset-right))
    8px
    max(15px,env(safe-area-inset-left));
  z-index:30;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.82),
      rgba(0,0,0,0)
    );

  transition:.25s;
}

.topbar.hide{
  opacity:0;
  pointer-events:none;
}

.topTitle{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:20px;
  letter-spacing:5px;
  font-weight:600;
}

.iconBtn{
  width:46px;
  height:46px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* ================= LOADING ================= */

#loading{
  position:absolute;
  inset:0;
  z-index:25;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.45);
  flex-direction:column;
  gap:15px;
}

.spinner{
  width:48px;
  height:48px;
  border:4px solid rgba(255,255,255,.2);
  border-top-color:#16c7f4;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.loadingText{
  color:#ddd;
  font-size:15px;
}

/* ================= ERROR ================= */

#errorBox{
  position:absolute;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.68);
  padding:20px;
}

.errorCard{
  width:min(620px,94vw);
  max-height:88vh;
  overflow:auto;
  background:#151515;
  border:1px solid #3a3a3a;
  border-radius:28px;
  padding:30px 22px 22px;
  text-align:center;
  box-shadow:0 15px 50px rgba(0,0,0,.65);
}

.warning{
  font-size:65px;
  line-height:1;
  margin-bottom:18px;
}

.errorTitle{
  font-size:29px;
  font-weight:600;
  margin-bottom:16px;
}

.errorMessage{
  color:#aaa;
  font-size:17px;
  line-height:1.65;
}

.errorCode{
  margin-top:18px;
  padding:15px;
  border-radius:14px;
  background:#080808;
  color:#16c7f4;
  font-size:16px;
  font-weight:bold;
}

#diagnostic{
  margin-top:15px;
  padding:14px;
  background:#090909;
  border-radius:12px;
  text-align:left;
  color:#aaa;
  font-size:12px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word;
  max-height:190px;
  overflow:auto;
}

.errorButtons{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:22px;
}

.errorBtn{
  border:0;
  border-radius:30px;
  min-width:145px;
  padding:15px 25px;
  font-size:17px;
  font-weight:600;
  cursor:pointer;
}

.retry{
  background:#16c7f4;
  color:#001018;
}

.close{
  background:#383838;
  color:#fff;
}

/* ================= CONTROLS ================= */

.controls{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  padding:10px 15px max(12px,env(safe-area-inset-bottom));

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,.9),
      rgba(0,0,0,0)
    );

  transition:.25s;
}

.controls.hide{
  opacity:0;
  pointer-events:none;
}

.progressRow{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:13px;
}

.liveText{
  color:#ddd;
  font-size:14px;
}

#seek{
  flex:1;
  accent-color:#16c7f4;
}

.controlRow{
  display:flex;
  align-items:center;
  gap:15px;
}

.controlButton{
  border:0;
  background:transparent;
  color:#fff;
  font-size:25px;
  min-width:35px;
  min-height:35px;
  cursor:pointer;
}

.volumeBox{
  display:flex;
  align-items:center;
  gap:8px;
  flex:1;
  max-width:180px;
}

#volume{
  width:100%;
  accent-color:#16c7f4;
}

.qualityBox{
  position:relative;
}

#qualityMenu{
  position:absolute;
  bottom:48px;
  right:0;
  width:170px;
  max-height:260px;
  overflow:auto;
  display:none;
  background:#161616;
  border:1px solid #333;
  border-radius:12px;
  padding:6px;
}

.qualityItem{
  padding:11px 12px;
  border-radius:8px;
  color:#ddd;
  font-size:14px;
  cursor:pointer;
}

.qualityItem:hover,
.qualityItem.active{
  background:#16c7f4;
  color:#000;
}

/* ================= ROTATION ================= */

#playerPage.rotated{
  width:100vh;
  height:100vw;
  transform:rotate(90deg);
  transform-origin:center center;

  left:50%;
  top:50%;

  margin-left:-50vw;
  margin-top:-50vh;
}

/* ================= DESKTOP ================= */

@media(min-width:800px){
  .topTitle{
    font-size:23px;
  }

  .controls{
    padding-left:35px;
    padding-right:35px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="playerPage">

    <video
      id="video"
      playsinline
      webkit-playsinline
      preload="auto"
      crossorigin="anonymous">
    </video>

    <!-- TOP BAR -->
    <div class="topbar" id="topbar">

      <button
        class="iconBtn"
        id="backBtn"
        aria-label="Back">
        ←
      </button>

      <div class="topTitle">
        LIVE TV
      </div>

      <button
        class="iconBtn"
        id="fullscreenBtn"
        aria-label="Fullscreen">
        ⛶
      </button>

    </div>

    <!-- LOADING -->
    <div id="loading">
      <div class="spinner"></div>
      <div class="loadingText">
        Loading stream...
      </div>
    </div>

    <!-- ERROR -->
    <div id="errorBox">

      <div class="errorCard">

        <div class="warning">⚠️</div>

        <div class="errorTitle">
          Playback Error
        </div>

        <div
          class="errorMessage"
          id="errorMessage">
          Unable to play this stream.
        </div>

        <div
          class="errorCode"
          id="errorCode">
          Shaka Error
        </div>

        <pre
          id="diagnostic"></pre>

        <div class="errorButtons">

          <button
            class="errorBtn retry"
            id="retryBtn">
            RETRY
          </button>

          <button
            class="errorBtn close"
            id="closeErrorBtn">
            CLOSE
          </button>

        </div>

      </div>

    </div>

    <!-- CONTROLS -->
    <div class="controls" id="controls">

      <div class="progressRow">

        <span class="liveText">
          LIVE
        </span>

        <input
          id="seek"
          type="range"
          min="0"
          max="100"
          value="100">

        <span class="liveText">
          LIVE
        </span>

      </div>

      <div class="controlRow">

        <button
          class="controlButton"
          id="playBtn">
          ▶
        </button>

        <button
          class="controlButton"
          id="muteBtn">
          🔊
        </button>

        <div class="volumeBox">
          <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1">
        </div>

        <button
          class="controlButton"
          id="back10Btn">
          ↶10
        </button>

        <button
          class="controlButton"
          id="forward10Btn">
          10↷
        </button>

        <div class="qualityBox">

          <button
            class="controlButton"
            id="qualityBtn">
            ⚙
          </button>

          <div id="qualityMenu"></div>

        </div>

        <button
          class="controlButton"
          id="pipBtn">
          ▣
        </button>

        <button
          class="controlButton"
          id="bottomFullscreenBtn">
          ⛶
        </button>

      </div>

    </div>

  </div>

</div>


<script>
"use strict";

/* =========================================================
   STREAM CONFIG
   ========================================================= */

/*
   আপনার অনুমোদিত MPD এখানে দিন
*/
const MPD_URL =
"https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/rhf2dwosdt/out/v1/ee550d2a68d846c797e6ce4de2e8b76d/cenc.mpd";

/*
   আপনার অনুমোদিত ClearKey এখানে দিন।

   KID এবং KEY অবশ্যই ওই MPD/content-এর জন্য সঠিক হতে হবে।
*/
const CLEAR_KEY_KID =
"69a5aa835a061ce64a630d1046727e40";

const CLEAR_KEY =
"d02feac8a999bd06bf4059bf33411749";


/* =========================================================
   ELEMENTS
   ========================================================= */

const playerPage =
document.getElementById("playerPage");

const video =
document.getElementById("video");

const loading =
document.getElementById("loading");

const loadingText =
document.querySelector(".loadingText");

const errorBox =
document.getElementById("errorBox");

const errorMessage =
document.getElementById("errorMessage");

const errorCode =
document.getElementById("errorCode");

const diagnostic =
document.getElementById("diagnostic");

const topbar =
document.getElementById("topbar");

const controls =
document.getElementById("controls");

const playBtn =
document.getElementById("playBtn");

const muteBtn =
document.getElementById("muteBtn");

const volume =
document.getElementById("volume");

const seek =
document.getElementById("seek");

const qualityMenu =
document.getElementById("qualityMenu");


/* =========================================================
   GLOBALS
   ========================================================= */

let player = null;

let hideTimer = null;

let currentError = null;

let isPlayerOpen = false;


/* =========================================================
   SHAKA INITIALIZATION
   ========================================================= */

async function initializeShaka(){

  try{

    if(!window.shaka){

      throw new Error(
        "Shaka Player library could not be loaded."
      );

    }

    /*
      Polyfills
    */
    shaka.polyfill.installAll();

    /*
      Browser support check
    */
    if(!shaka.Player.isBrowserSupported()){

      showPlaybackError(
        null,
        "এই browser/device Shaka Player-এর প্রয়োজনীয় media features support করছে না।"
      );

      return false;
    }

    /*
      Destroy old player
    */
    if(player){

      try{
        await player.destroy();
      }catch(e){}

      player = null;
    }

    /*
      Create new player
    */
    player =
      new shaka.Player(video);

    /*
      Error listener
    */
    player.addEventListener(
      "error",
      onShakaError
    );

    /*
      ClearKey configuration
    */
    player.configure({

      drm:{
        clearKeys:{
          [CLEAR_KEY_KID]: CLEAR_KEY
        }
      },

      streaming:{

        /*
          Live stream-এর জন্য
        */
        lowLatencyMode:true,

        /*
          Network retry
        */
        retryParameters:{

          maxAttempts:4,

          baseDelay:1000,

          backoffFactor:2,

          fuzzFactor:0.5,

          timeout:30000

        },

        rebufferingGoal:2,

        bufferingGoal:10,

        stallEnabled:true

      },

      manifest:{

        retryParameters:{

          maxAttempts:4,

          baseDelay:1000,

          backoffFactor:2,

          fuzzFactor:0.5,

          timeout:30000

        }

      }

    });

    return true;

  }catch(error){

    console.error(
      "Shaka initialization error:",
      error
    );

    showPlaybackError(
      error,
      "Shaka Player initialize করা যায়নি।"
    );

    return false;
  }
}


/* =========================================================
   LOAD STREAM
   ========================================================= */

async function loadStream(){

  hideError();

  showLoading(
    "Connecting to live stream..."
  );

  try{

    const ok =
      await initializeShaka();

    if(!ok){
      hideLoading();
      return;
    }

    console.log(
      "Loading MPD:",
      MPD_URL
    );

    /*
      IMPORTANT:
      DRM configuration is already done
      before load().
    */

    await player.load(MPD_URL);

    console.log(
      "MPD loaded successfully."
    );

    hideLoading();

    /*
      Get quality tracks
    */
    buildQualityMenu();

    /*
      Try autoplay
    */
    try{

      await video.play();

      playBtn.textContent = "❚❚";

    }catch(playError){

      console.log(
        "Autoplay blocked:",
        playError
      );

      playBtn.textContent = "▶";
    }

    showControls();

  }catch(error){

    console.error(
      "PLAYBACK ERROR:",
      error
    );

    hideLoading();

    showPlaybackError(
      error
    );
  }
}


/* =========================================================
   SHAKA ERROR
   ========================================================= */

function onShakaError(event){

  console.error(
    "Shaka error event:",
    event
  );

  showPlaybackError(
    event.detail
  );
}


/* =========================================================
   ERROR DISPLAY
   ========================================================= */

function showPlaybackError(
  error,
  customMessage = null
){

  currentError = error;

  errorBox.style.display =
    "flex";

  let code = "UNKNOWN";

  let category = "UNKNOWN";

  let severity = "UNKNOWN";

  let data = "";

  if(error){

    code =
      error.code ??
      "UNKNOWN";

    category =
      error.category ??
      "UNKNOWN";

    severity =
      error.severity ??
      "UNKNOWN";

    try{

      if(error.data){

        data =
          JSON.stringify(
            error.data,
            null,
            2
          );

      }

    }catch(e){

      data =
        String(error.data);
    }
  }

  errorCode.textContent =
    "Shaka Error Code: " + code;

  /*
    এখানে আর 1001-কে ভুল করে
    "browser unsupported" বলা হচ্ছে না।
  */

  if(customMessage){

    errorMessage.textContent =
      customMessage;

  }else{

    errorMessage.textContent =
      getErrorExplanation(error);

  }

  diagnostic.textContent =
`DETAILS

Shaka:
${window.shaka?.Player?.version || "unknown"}

Code:
${code}

Category:
${category}

Severity:
${severity}

HTTPS:
${location.protocol === "https:" ? "YES" : "NO"}

Secure Context:
${window.isSecureContext ? "YES" : "NO"}

MSE:
${typeof MediaSource !== "undefined" ? "YES" : "NO"}

EME:
${typeof navigator.requestMediaKeySystemAccess === "function" ? "YES" : "NO"}

Online:
${navigator.onLine ? "YES" : "NO"}

Browser:
${navigator.userAgent}

MPD:
${MPD_URL}

Error Data:
${data || "No additional data"}`;

}


/* =========================================================
   ERROR EXPLANATION
   ========================================================= */

function getErrorExplanation(error){

  if(!error){

    return `
ভিডিও চালানো যায়নি।

RETRY চাপুন।

যদি আবার একই error আসে,
নিচের DETAILS দেখুন।
`;
  }

  const code =
    Number(error.code);

  switch(code){

    /*
      Shaka 1001 সাধারণত manifest/media
      compatibility ধরনের failure-এর দিকে
      ইঙ্গিত করতে পারে; শুধু browser unsupported
      ধরে নেওয়া ঠিক নয়।
    */

    case 1001:

      return `
MPD থেকে browser-এর জন্য playable
media variant পাওয়া যায়নি।

সম্ভাব্য কারণ:

• unsupported video codec
• unsupported audio codec
• encrypted media configuration
• incompatible MPD representation
• manifest/segment সমস্যা

নিচের DETAILS-এ আসল error data দেখুন।
`;

    case 1002:

      return `
MPD load/parse করতে সমস্যা হয়েছে।

MPD URL, server response অথবা
manifest format পরীক্ষা করুন।
`;

    default:

      return `
Shaka Player playback error হয়েছে।

Code: ${error.code}

নিচের DETAILS section-এ
আসল diagnostic information দেওয়া আছে।
`;
  }
}


/* =========================================================
   LOADING
   ========================================================= */

function showLoading(text){

  loading.style.display =
    "flex";

  loadingText.textContent =
    text || "Loading...";
}


function hideLoading(){

  loading.style.display =
    "none";
}


/* =========================================================
   ERROR HIDE
   ========================================================= */

function hideError(){

  errorBox.style.display =
    "none";

}


/* =========================================================
   QUALITY
   ========================================================= */

function buildQualityMenu(){

  qualityMenu.innerHTML = "";

  if(!player){
    return;
  }

  let tracks = [];

  try{

    tracks =
      player.getVariantTracks();

  }catch(e){

    console.error(e);

    return;
  }

  /*
    Remove duplicates
  */
  const unique =
    new Map();

  tracks.forEach(track => {

    if(
      !track.height &&
      !track.width
    ){
      return;
    }

    const key =
      `${track.height || 0}-${track.bandwidth || 0}`;

    if(!unique.has(key)){

      unique.set(
        key,
        track
      );
    }

  });

  /*
    Auto
  */
  const auto =
    document.createElement("div");

  auto.className =
    "qualityItem active";

  auto.textContent =
    "AUTO";

  auto.onclick = () => {

    try{

      player.configure({
        abr:{
          enabled:true
        }
      });

      markQualityActive(auto);

      qualityMenu.style.display =
        "none";

    }catch(e){

      console.error(e);
    }

  };

  qualityMenu.appendChild(auto);


  /*
    Quality tracks
  */
  [...unique.values()]
    .sort(
      (a,b) =>
        (a.height || 0) -
        (b.height || 0)
    )
    .forEach(track => {

      const item =
        document.createElement("div");

      item.className =
        "qualityItem";

      item.textContent =
        track.height
          ? `${track.height}p`
          : `${Math.round((track.bandwidth || 0)/1000)} kbps`;

      item.onclick = () => {

        try{

          player.configure({
            abr:{
              enabled:false
            }
          });

          player.selectVariantTrack(
            track,
            true
          );

          markQualityActive(item);

          qualityMenu.style.display =
            "none";

        }catch(e){

          console.error(e);
        }

      };

      qualityMenu.appendChild(item);

    });

}


function markQualityActive(active){

  document
    .querySelectorAll(".qualityItem")
    .forEach(item => {

      item.classList.remove(
        "active"
      );

    });

  active.classList.add(
    "active"
  );
}


/* =========================================================
   PLAY / PAUSE
   ========================================================= */

playBtn.addEventListener(
  "click",
  async () => {

    try{

      if(video.paused){

        await video.play();

        playBtn.textContent =
          "❚❚";

      }else{

        video.pause();

        playBtn.textContent =
          "▶";

      }

      showControls();

    }catch(error){

      console.error(error);

    }

  }
);


/* =========================================================
   VOLUME
   ========================================================= */

volume.addEventListener(
  "input",
  () => {

    video.volume =
      Number(volume.value);

    video.muted =
      video.volume === 0;

    updateMuteIcon();

  }
);


muteBtn.addEventListener(
  "click",
  () => {

    video.muted =
      !video.muted;

    updateMuteIcon();

    showControls();

  }
);


function updateMuteIcon(){

  muteBtn.textContent =
    video.muted || video.volume === 0
      ? "🔇"
      : "🔊";

}


/* =========================================================
   SEEK
   ========================================================= */

seek.addEventListener(
  "input",
  () => {

    if(!video.duration){
      return;
    }

    const percentage =
      Number(seek.value) / 100;

    try{

      video.currentTime =
        percentage *
        video.duration;

    }catch(e){}

  }
);


video.addEventListener(
  "timeupdate",
  () => {

    if(
      !video.duration ||
      !isFinite(video.duration)
    ){
      return;
    }

    seek.value =
      (video.currentTime /
       video.duration) * 100;

  }
);


/* =========================================================
   +/- 10 SEC
   ========================================================= */

document
  .getElementById("back10Btn")
  .addEventListener(
    "click",
    () => {

      try{

        video.currentTime =
          Math.max(
            0,
            video.currentTime - 10
          );

      }catch(e){}

      showControls();

    }
  );


document
  .getElementById("forward10Btn")
  .addEventListener(
    "click",
    () => {

      try{

        video.currentTime =
          Math.min(
            video.duration || Infinity,
            video.currentTime + 10
          );

      }catch(e){}

      showControls();

    }
  );


/* =========================================================
   QUALITY BUTTON
   ========================================================= */

document
  .getElementById("qualityBtn")
  .addEventListener(
    "click",
    (event) => {

      event.stopPropagation();

      qualityMenu.style.display =
        qualityMenu.style.display === "block"
          ? "none"
          : "block";

      showControls();

    }
  );


document.addEventListener(
  "click",
  (event) => {

    if(
      !event.target.closest(".qualityBox")
    ){

      qualityMenu.style.display =
        "none";
    }

  }
);


/* =========================================================
   PIP
   ========================================================= */

document
  .getElementById("pipBtn")
  .addEventListener(
    "click",
    async () => {

      try{

        if(
          document.pictureInPictureElement
        ){

          await document.exitPictureInPicture();

        }else if(
          document.pictureInPictureEnabled &&
          video.requestPictureInPicture
        ){

          await video.requestPictureInPicture();

        }

      }catch(error){

        console.error(
          "PiP error:",
          error
        );

      }

      showControls();

    }
  );


/* =========================================================
   FULLSCREEN
   ========================================================= */

async function enterFullscreen(){

  try{

    /*
      Native fullscreen
    */

    if(
      document.fullscreenElement
    ){

      await document.exitFullscreen();

      return;
    }

    if(
      playerPage.requestFullscreen
    ){

      await playerPage.requestFullscreen();

    }else if(
      video.webkitEnterFullscreen
    ){

      video.webkitEnterFullscreen();

    }

    /*
      Try landscape on supported Android
    */

    if(
      screen.orientation &&
      screen.orientation.lock
    ){

      try{

        await screen.orientation.lock(
          "landscape"
        );

      }catch(e){}

    }

  }catch(error){

    console.log(
      "Fullscreen fallback:",
      error
    );

    /*
      CSS fallback
    */

    playerPage.classList.toggle(
      "rotated"
    );

  }

}


document
  .getElementById("fullscreenBtn")
  .addEventListener(
    "click",
    enterFullscreen
  );


document
  .getElementById("bottomFullscreenBtn")
  .addEventListener(
    "click",
    enterFullscreen
  );


document.addEventListener(
  "fullscreenchange",
  () => {

    showControls();

  }
);


/* =========================================================
   CONTROLS AUTO HIDE
   ========================================================= */

function showControls(){

  controls.classList.remove(
    "hide"
  );

  topbar.classList.remove(
    "hide"
  );

  clearTimeout(
    hideTimer
  );

  hideTimer =
    setTimeout(
      () => {

        if(
          !video.paused &&
          errorBox.style.display !== "flex"
        ){

          controls.classList.add(
            "hide"
          );

          topbar.classList.add(
            "hide"
          );

        }

      },
      5000
    );

}


/* =========================================================
   PLAYER TAP
   ========================================================= */

playerPage.addEventListener(
  "click",
  (event) => {

    if(
      event.target.closest("button") ||
      event.target.closest("input") ||
      event.target.closest(".qualityBox")
    ){
      return;
    }

    showControls();

  }
);


/* =========================================================
   BACK
   ========================================================= */

document
  .getElementById("backBtn")
  .addEventListener(
    "click",
    closePlayer
  );


async function closePlayer(){

  isPlayerOpen = false;

  clearTimeout(
    hideTimer
  );

  hideError();

  hideLoading();

  try{

    if(
      document.fullscreenElement
    ){

      await document.exitFullscreen();

    }

  }catch(e){}

  try{

    if(
      screen.orientation &&
      screen.orientation.unlock
    ){

      screen.orientation.unlock();

    }

  }catch(e){}

  playerPage.classList.remove(
    "rotated"
  );

  if(player){

    try{

      await player.destroy();

    }catch(e){

      console.log(e);

    }

    player = null;
  }

  video.removeAttribute(
    "src"
  );

  video.load();

  playerPage.style.display =
    "none";

}


/* =========================================================
   RETRY
   ========================================================= */

document
  .getElementById("retryBtn")
  .addEventListener(
    "click",
    async () => {

      hideError();

      await loadStream();

    }
  );


document
  .getElementById("closeErrorBtn")
  .addEventListener(
    "click",
    () => {

      hideError();

    }
  );


/* =========================================================
   VIDEO EVENTS
   ========================================================= */

video.addEventListener(
  "waiting",
  () => {

    showLoading(
      "Buffering..."
    );

  }
);


video.addEventListener(
  "playing",
  () => {

    hideLoading();

    playBtn.textContent =
      "❚❚";

    showControls();

  }
);


video.addEventListener(
  "pause",
  () => {

    hideLoading();

    playBtn.textContent =
      "▶";

    showControls();

  }
);


video.addEventListener(
  "canplay",
  () => {

    hideLoading();

  }
);


video.addEventListener(
  "error",
  () => {

    console.error(
      "HTML5 Video Error:",
      video.error
    );

  }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if(!isPlayerOpen){
      return;
    }

    switch(event.key){

      case " ":

        event.preventDefault();

        playBtn.click();

        break;

      case "ArrowLeft":

        video.currentTime =
          Math.max(
            0,
            video.currentTime - 10
          );

        break;

      case "ArrowRight":

        video.currentTime =
          Math.min(
            video.duration || Infinity,
            video.currentTime + 10
          );

        break;

      case "Escape":

        if(
          document.fullscreenElement
        ){

          document.exitFullscreen();

        }

        break;

    }

    showControls();

  }
);


/* =========================================================
   OPEN PLAYER
   ========================================================= */

async function openPlayer(){

  isPlayerOpen = true;

  playerPage.style.display =
    "block";

  showControls();

  await loadStream();

}


/* =========================================================
   PAGE LOAD
   ========================================================= */

window.addEventListener(
  "load",
  async () => {

    /*
      এখানে সরাসরি player চালু হবে।
      চাইলে openPlayer() এর বদলে
      আপনার channel card থেকে call করতে পারবেন।
    */

    await openPlayer();

  }
);


/* =========================================================
   NETWORK STATUS
   ========================================================= */

window.addEventListener(
  "offline",
  () => {

    if(isPlayerOpen){

      loadingText.textContent =
        "Internet connection lost...";

      showLoading();

    }

  }
);


window.addEventListener(
  "online",
  () => {

    if(isPlayerOpen){

      hideLoading();

    }

  }
);


/* =========================================================
   GLOBAL ERROR LOG
   ========================================================= */

window.addEventListener(
  "unhandledrejection",
  event => {

    console.error(
      "Unhandled Promise:",
      event.reason
    );

  }
);

window.addEventListener(
  "error",
  event => {

    console.error(
      "JavaScript Error:",
      event.error
    );

  }
);

</script>
