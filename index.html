<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>LIVE TV</title>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.3/dist/shaka-player.compiled.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#020305;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overflow:hidden;
}

/* ================= HOME ================= */

#home{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;

  background:
  radial-gradient(
    circle at center,
    #10242b 0,
    #05080b 42%,
    #010203 100%
  );
}

#home:before,
#home:after{
  content:"";
  position:absolute;
  border-radius:50%;
  filter:blur(2px);
  pointer-events:none;
}

#home:before{
  width:330px;
  height:330px;
  border:1px solid rgba(25,216,255,.15);
  box-shadow:
  0 0 80px rgba(25,216,255,.12);
}

#home:after{
  width:520px;
  height:520px;
  border:1px solid rgba(25,216,255,.06);
}

/* ================= MATCH CARD ================= */

.brand{
  text-align:center;
  z-index:2;
  width:100%;
  max-width:520px;
  padding:20px;
}

/* Match Logo */

.logo{
  width:430px;
  min-height:210px;
  margin:auto;

  border-radius:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
    145deg,
    rgba(16,27,32,.98),
    rgba(2,5,7,.98)
  );

  border:2px solid #19d8ff;

  box-shadow:
  0 0 20px rgba(25,216,255,.55),
  0 0 70px rgba(25,216,255,.15),
  inset 0 0 30px rgba(25,216,255,.08);

  transition:.2s;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

.logo:active{
  transform:scale(.96);
}

/* ================= TEAMS ================= */

.match{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
}

/* Team */

.team{
  width:145px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.team-logo{
  width:95px;
  height:95px;

  border-radius:50%;

  object-fit:cover;

  background:#fff;

  border:3px solid rgba(255,255,255,.85);

  box-shadow:
  0 0 18px rgba(25,216,255,.45);
}

.team-name{
  margin-top:12px;

  font-size:15px;
  font-weight:900;

  letter-spacing:1px;

  color:#fff;

  text-transform:uppercase;
}

/* VS */

.vs{
  width:55px;
  height:55px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
  linear-gradient(
    145deg,
    #19d8ff,
    #087e99
  );

  color:#001015;

  font-size:18px;
  font-weight:1000;

  box-shadow:
  0 0 20px rgba(25,216,255,.65);

  flex-shrink:0;
}

/* Title */

.title{
  margin-top:22px;

  font-size:24px;
  font-weight:900;

  letter-spacing:4px;
}

.subtitle{
  margin-top:8px;

  font-size:11px;

  letter-spacing:2px;

  color:#8fa2a8;
}

.tap{
  margin-top:25px;

  display:inline-block;

  padding:9px 18px;

  border:1px solid rgba(25,216,255,.45);

  border-radius:30px;

  color:#19d8ff;

  font-size:12px;

  letter-spacing:1px;
}

/* ================= PLAYER ================= */

#playerPage{
  display:none;

  position:fixed;
  inset:0;

  background:#000;
}

video{
  width:100%;
  height:100%;

  object-fit:contain;

  background:#000;
}

/* Back */

#back{
  position:absolute;

  top:16px;
  left:16px;

  z-index:10;

  width:46px;
  height:46px;

  border:1px solid rgba(255,255,255,.25);

  border-radius:50%;

  background:rgba(0,0,0,.65);

  color:#fff;

  font-size:28px;

  cursor:pointer;
}

/* Message */

#message{
  position:absolute;

  left:50%;
  bottom:25px;

  transform:translateX(-50%);

  z-index:20;

  padding:10px 16px;

  border-radius:10px;

  background:rgba(0,0,0,.78);

  color:#ddd;

  font-size:13px;

  display:none;

  max-width:90%;

  text-align:center;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .brand{
    padding:15px;
  }

  .logo{
    width:94%;
    min-height:190px;

    border-radius:24px;
  }

  .match{
    gap:8px;
  }

  .team{
    width:105px;
  }

  .team-logo{
    width:75px;
    height:75px;
  }

  .team-name{
    font-size:12px;
    margin-top:9px;
  }

  .vs{
    width:48px;
    height:48px;

    font-size:15px;
  }

  .title{
    font-size:20px;
    letter-spacing:3px;
  }

  .subtitle{
    font-size:9px;
  }
}
</style>
</head>

<body>

<!-- ================= HOME ================= -->

<div id="home">

  <div class="brand">

    <!-- MATCH CARD -->

    <div class="logo" id="logoButton">

      <div class="match">

        <!-- TEAM 1 -->

        <div class="team">

          <img
            class="team-logo"
            src="https://flagcdn.com/w320/bd.png"
            alt="Bangladesh"
          >

          <div class="team-name">
            Bangladesh
          </div>

        </div>

        <!-- VS -->

        <div class="vs">
          VS
        </div>

        <!-- TEAM 2 -->

        <div class="team">

          <img
            class="team-logo"
            src="https://flagcdn.com/w320/ar.png"
            alt="Argentina"
          >

          <div class="team-name">
            Argentina
          </div>

        </div>

      </div>

    </div>

    <div class="title">
      LIVE TV
    </div>

    <div class="subtitle">
      PREMIUM STREAM PLAYER
    </div>

    <div class="tap">
      TAP MATCH TO PLAY
    </div>

  </div>

</div>


<!-- ================= PLAYER ================= -->

<div id="playerPage">

  <button
    id="back"
    onclick="closePlayer()"
  >
    ‹
  </button>

  <video
    id="video"
    controls
    playsinline>
  </video>

  <div id="message"></div>

</div>


<script>

/*
====================================================
AUTHORIZED DASH + CLEARKEY STREAM
====================================================

Format:

MPD_URL|drmScheme=clearkey&drmLicense=KEY_ID:KEY

*/

const STREAM_URL =
`https://abfjk4haaaaaaaamkitc5445rybm6.bia-cf.live.pv-cdn.net/iad-nitro/live/clients/dash/enc/docqurfrc3/out/v1/1804c33d898a48cb988e15cca0199512/cenc.mpd|drmScheme=clearkey&drmLicense=2fbb11f58d670ba448625bee36773fff:76e8bd546a74e60598e1d59df0b9b3cc`;


let player = null;


/* ================= MESSAGE ================= */

function showMessage(t){

  const e =
  document.getElementById("message");

  e.textContent = t;

  e.style.display = "block";
}


function hideMessage(){

  document.getElementById("message")
  .style.display = "none";
}


/* ================= PARSE STREAM ================= */

function parseStream(input){

  const p = input.split("|");

  const mpd = p[0].trim();

  let drmScheme = "";
  let drmLicense = "";

  if(p.length > 1){

    const q =
    new URLSearchParams(
      p.slice(1).join("|")
    );

    drmScheme =
    q.get("drmScheme") || "";

    drmLicense =
    q.get("drmLicense") || "";
  }

  return {
    mpd,
    drmScheme,
    drmLicense
  };
}


/* ================= OPEN PLAYER ================= */

async function openPlayer(){

  if(
    STREAM_URL.includes(
      "PASTE_YOUR_AUTHORIZED"
    )
  ){

    showMessage(
      "Add your authorized MPD stream in STREAM_URL first."
    );

    return;
  }


  document.getElementById("home")
  .style.display = "none";


  document.getElementById("playerPage")
  .style.display = "block";


  hideMessage();


  shaka.polyfill.installAll();


  if(
    !shaka.Player.isBrowserSupported()
  ){

    showMessage(
      "DASH playback is not supported in this browser."
    );

    return;
  }


  const video =
  document.getElementById("video");


  if(player){

    try{
      await player.destroy();
    }catch(e){}

  }


  player =
  new shaka.Player(video);


  player.addEventListener(
    "error",
    e => {

      console.error(e.detail);

      showMessage(
        "Playback error. Check your authorized MPD/DRM settings."
      );

    }
  );


  try{

    const d =
    parseStream(STREAM_URL);


    /* CLEARKEY */

    if(
      d.drmScheme.toLowerCase()
      === "clearkey"
      &&
      d.drmLicense
    ){

      const k =
      d.drmLicense.split(":");


      if(k.length < 2){

        throw new Error(
          "Invalid ClearKey format"
        );

      }


      player.configure({

        drm:{

          clearKeys:{

            [k[0].trim()]:
            k[1].trim()

          }

        }

      });

    }


    showMessage(
      "Loading stream..."
    );


    await player.load(d.mpd);


    hideMessage();


    try{

      await video.play();

    }catch(e){}

  }
  catch(err){

    console.error(err);

    showMessage(
      "Stream could not be loaded."
    );

  }

}


/* ================= CLOSE PLAYER ================= */

async function closePlayer(){

  if(player){

    try{

      await player.destroy();

    }catch(e){}

    player = null;

  }


  const v =
  document.getElementById("video");


  v.pause();

  v.removeAttribute("src");

  v.load();


  document.getElementById("playerPage")
  .style.display = "none";


  document.getElementById("home")
  .style.display = "flex";

}


/* ================= CLICK ================= */

document
.getElementById("logoButton")
.addEventListener(
  "click",
  openPlayer
);

</script>

</body>
</html>
